  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f6f5fc 0%, #f0eef9 100%);
      min-height: 100vh;
      padding: 0;
      padding-top: 80px;
      padding-bottom: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ===== HEADER ===== */
    .header-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 2000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(75, 42, 173, 0.1);
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: #4b2aad;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .logo-text {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: #4b2aad;
      cursor: default;
      user-select: none;
    }

    .nav-logo-img {
      height: 36px;
      width: auto;
      object-fit: contain;
      cursor: default;
    }

    .logo .highlight {
      color: #ffffff;
      text-shadow: 0 0 2px #4b2aad, 0 0 4px #4b2aad, 0 0 6px #4b2aad;
    }

    .home-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      border-radius: 30px;
      background: #f5f0ff;
      color: #4b2aad;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.25s ease;
      border: none;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
    }

    .home-btn:hover {
      background: #4b2aad;
      color: #ffffff;
      transform: translateX(-2px);
      box-shadow: 0 4px 12px rgba(75, 42, 173, 0.3);
    }

    /* ===== PROFILE FORM ===== */
    .profile-form-container {
      max-width: 500px;
      width: 90%;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 35px 40px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.08);
      border: 1px solid rgba(255,255,255,0.3);
    }

    .profile-form-container h2 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      color: #4b2aad;
      text-align: center;
      margin-bottom: 8px;
    }

    .profile-form-container .subtitle {
      text-align: center;
      color: #888;
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    .profile-form label {
      display: block;
      font-weight: 600;
      color: #2d2a24;
      font-size: 0.9rem;
      margin-bottom: 6px;
    }

    .profile-form input,
    .profile-form textarea {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e8e4f0;
      border-radius: 14px;
      font-size: 1rem;
      font-family: 'Inter', sans-serif;
      background: rgba(255,255,255,0.95);
      transition: all 0.25s ease;
      color: #1a1a1a;
    }

    .profile-form input:focus,
    .profile-form textarea:focus {
      outline: none;
      border-color: #4b2aad;
      box-shadow: 0 0 0 4px rgba(75, 42, 173, 0.1);
    }

    .profile-form textarea {
      resize: vertical;
      min-height: 100px;
      border-radius: 14px;
    }

    .profile-form .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .profile-form .input-wrapper input {
      padding-right: 48px;
    }

    .validation-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.1rem;
      transition: 0.2s;
      pointer-events: none;
    }

    .validation-icon.valid { color: #28a745; }
    .validation-icon.invalid { color: #dc3545; }
    .validation-icon.loading { color: #4b2aad; animation: spin 1s linear infinite; }

    .validation-message {
      font-size: 0.8rem;
      margin-top: 4px;
      padding: 6px 12px;
      border-radius: 8px;
      display: none;
    }

    .validation-message.show { display: block; }
    .validation-message.success { color: #28a745; background: #dff7e5; }
    .validation-message.error { color: #dc3545; background: #fde8e8; }
    .validation-message.info { color: #4b2aad; background: #f0eaff; }
    .validation-message.warning { color: #856404; background: #fff3cd; }

    .hint {
      font-size: 0.75rem;
      color: #888;
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group:last-of-type {
      margin-bottom: 24px;
    }

    .btn-save {
      width: 100%;
      background: linear-gradient(135deg, #4b2aad, #6f4ae4);
      color: #fff;
      padding: 14px 28px;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Inter', sans-serif;
    }

    .btn-save:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(75, 42, 173, 0.3);
    }

    .btn-save:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      margin-top: 12px;
      padding: 12px 24px;
      border: 2px solid #e8e4f0;
      border-radius: 14px;
      background: transparent;
      color: #4b2aad;
      font-weight: 500;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.25s ease;
      font-family: 'Inter', sans-serif;
      text-decoration: none;
    }

    .btn-back:hover {
      background: #f5f0ff;
      border-color: #4b2aad;
      transform: translateX(-2px);
    }

    .btn-back i {
      font-size: 0.9rem;
    }

    .success-msg {
      color: #28a745;
      margin-top: 12px;
      padding: 12px 16px;
      background: #dff7e5;
      border-radius: 12px;
      display: none;
      font-weight: 500;
      text-align: center;
    }

    .error-msg {
      color: #dc3545;
      margin-top: 12px;
      padding: 12px 16px;
      background: #fde8e8;
      border-radius: 12px;
      display: none;
      font-weight: 500;
      text-align: center;
    }

    @keyframes spin {
      0% { transform: translateY(-50%) rotate(0deg); }
      100% { transform: translateY(-50%) rotate(360deg); }
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      body {
        padding-top: 70px;
        padding-bottom: 30px;
      }
      .header-bar {
        padding: 10px 16px;
      }
      .logo-text {
        font-size: 1.2rem;
      }
      .nav-logo-img {
        height: 28px;
      }
      .home-btn {
        font-size: 0.75rem;
        padding: 6px 14px;
      }
      .profile-form-container {
        padding: 24px 20px;
        border-radius: 16px;
        width: 95%;
      }
      .profile-form-container h2 {
        font-size: 1.6rem;
      }
    }

    @media (max-width: 480px) {
      body {
        padding-top: 60px;
        padding-bottom: 20px;
      }
      .header-bar {
        padding: 8px 12px;
      }
      .logo-text {
        font-size: 1rem;
      }
      .nav-logo-img {
        height: 22px;
      }
      .home-btn {
        font-size: 0.7rem;
        padding: 5px 12px;
      }
      .profile-form-container {
        padding: 18px 14px;
        border-radius: 14px;
        width: 98%;
      }
      .profile-form-container h2 {
        font-size: 1.3rem;
      }
      .profile-form input,
      .profile-form textarea {
        padding: 12px 14px;
        font-size: 0.95rem;
        border-radius: 12px;
      }
      .btn-save {
        padding: 12px 20px;
        font-size: 0.95rem;
        border-radius: 12px;
      }
      .btn-back {
        padding: 10px 16px;
        font-size: 0.9rem;
        border-radius: 12px;
      }
    }
  </style>
</head>
<body>

<!-- ===== HEADER ===== -->
<header class="header-bar">
  <div class="logo">
    <img src="images/logokk.png" alt="Volant Poetry Logo" class="nav-logo-img">
    <span class="logo-text">
      <span class="highlight">Volant</span> Poetry
    </span>
  </div>
  <a href="user-profile.html" class="home-btn">Back</a>
</header>

<!-- ===== MAIN CONTENT ===== -->
<div class="profile-form-container">
  <h2> Edit Profile</h2>
  <p class="subtitle">Update your personal information</p>

  <form class="profile-form" id="profileForm">
    <div class="form-group">
      <label for="editRealName">Real Name <span style="color:#888;font-weight:400;">(optional)</span></label>
      <input type="text" id="editRealName" placeholder="Enter your real name">
    </div>

    <div class="form-group">
      <label for="editUsername">Username <span style="color:#dc3545;">*</span></label>
      <div class="input-wrapper">
        <input type="text" id="editUsername" placeholder="3-11 characters" maxlength="11" />
        <span class="validation-icon" id="usernameIcon"></span>
      </div>
      <div class="validation-message" id="usernameValidation"></div>
      <div class="hint">3-11 characters, spaces and special characters allowed</div>
    </div>

    <div class="form-group">
      <label for="editEmail">Email <span style="color:#dc3545;">*</span></label>
      <div class="input-wrapper">
        <input type="email" id="editEmail" placeholder="Enter your email" />
        <span class="validation-icon" id="emailIcon"></span>
      </div>
      <div class="validation-message" id="emailValidation"></div>
    </div>

    <div class="form-group">
      <label for="editBio">Bio</label>
      <textarea id="editBio" rows="4" placeholder="Tell us about yourself..."></textarea>
    </div>

    <button type="button" id="saveProfileBtn" class="btn-save" disabled>Save Changes</button>

    <a href="user-profile.html" class="btn-back">
      Back to Profile
    </a>

    <div class="success-msg" id="successMsg">✅ Profile updated successfully!</div>
    <div class="error-msg" id="errorMsg">❌ Failed to update profile. Try again.</div>
  </form>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, getDoc, updateDoc, setDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC4DHI8aBVY4JjTvJ-r-TGIDPsewtEWxzU",
    authDomain: "silent-depth.firebaseapp.com",
    projectId: "silent-depth",
    storageBucket: "silent-depth.appspot.com",
    messagingSenderId: "78008755450",
    appId: "1:78008755450:web:3fd0f0f298a08820935543"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  // DOM refs
  const realNameInput = document.getElementById("editRealName");
  const usernameInput = document.getElementById("editUsername");
  const emailInput = document.getElementById("editEmail");
  const bioInput = document.getElementById("editBio");
  const saveBtn = document.getElementById("saveProfileBtn");
  const successMsg = document.getElementById("successMsg");
  const errorMsg = document.getElementById("errorMsg");
  const usernameIcon = document.getElementById("usernameIcon");
  const usernameValidation = document.getElementById("usernameValidation");
  const emailIcon = document.getElementById("emailIcon");
  const emailValidation = document.getElementById("emailValidation");

  let currentUserUid = null;
  let originalUsername = '';
  let originalEmail = '';
  let originalRealName = '';
  let originalBio = '';
  let usernameValid = false;
  let emailValid = false;
  let usernameTimeout = null;
  let emailTimeout = null;

  // ===== VALIDATION FUNCTIONS =====

  function validateUsernameFormat(username) {
    if (!username || username.length < 3) {
      return { valid: false, message: 'Username must be at least 3 characters' };
    }
    if (username.length > 11) {
      const truncated = username.substring(0, 11);
      usernameInput.value = truncated;
      return { valid: true, message: 'Username truncated to 11 characters', truncated: true };
    }
    return { valid: true, message: 'Username is available!' };
  }

  function validateEmailFormat(email) {
    if (!email || !email.includes('@') || !email.includes('.')) {
      return { valid: false, message: 'Please enter a valid email address' };
    }
    return { valid: true, message: 'Email format is valid' };
  }

  async function checkUsernameAvailability(username) {
    if (!username || username.length < 3) return { available: false, error: 'Username too short' };
    
    if (username === originalUsername) {
      return { available: true, isOriginal: true };
    }
    
    try {
      const q = query(collection(db, 'users'), where('username', '==', username));
      const snapshot = await getDocs(q);
      const taken = !snapshot.empty;
      return { available: !taken, taken: taken };
    } catch (err) {
      console.warn('Error checking username:', err);
      return { available: false, error: 'Error checking availability' };
    }
  }

  async function checkEmailAvailability(email) {
    if (!email || !email.includes('@')) return { available: false, error: 'Invalid email' };
    
    if (email === originalEmail) {
      return { available: true, isOriginal: true };
    }
    
    try {
      const q = query(collection(db, 'users'), where('email', '==', email));
      const snapshot = await getDocs(q);
      const taken = !snapshot.empty;
      return { available: !taken, taken: taken };
    } catch (err) {
      console.warn('Error checking email:', err);
      return { available: false, error: 'Error checking availability' };
    }
  }

  // ===== UPDATE UI FUNCTIONS =====

  function updateUsernameValidation(result) {
    if (result.valid && result.available) {
      usernameIcon.className = 'validation-icon valid';
      usernameIcon.innerHTML = '<i class="fas fa-check-circle"></i>';
      usernameValidation.className = 'validation-message show success';
      usernameValidation.textContent = result.isOriginal ? '✓ Current username' : '✓ Username is available!';
      usernameValid = true;
    } else if (result.valid && !result.available) {
      usernameIcon.className = 'validation-icon invalid';
      usernameIcon.innerHTML = '<i class="fas fa-times-circle"></i>';
      usernameValidation.className = 'validation-message show error';
      usernameValidation.textContent = '✗ This username is already taken';
      usernameValid = false;
    } else if (!result.valid) {
      usernameIcon.className = 'validation-icon invalid';
      usernameIcon.innerHTML = '<i class="fas fa-exclamation-circle"></i>';
      usernameValidation.className = 'validation-message show warning';
      usernameValidation.textContent = result.message || 'Invalid username';
      usernameValid = false;
    }
    updateSaveButton();
  }

  function updateEmailValidation(result) {
    if (result.valid && result.available) {
      emailIcon.className = 'validation-icon valid';
      emailIcon.innerHTML = '<i class="fas fa-check-circle"></i>';
      emailValidation.className = 'validation-message show success';
      emailValidation.textContent = result.isOriginal ? '✓ Current email' : '✓ Email is available!';
      emailValid = true;
    } else if (result.valid && !result.available) {
      emailIcon.className = 'validation-icon invalid';
      emailIcon.innerHTML = '<i class="fas fa-times-circle"></i>';
      emailValidation.className = 'validation-message show error';
      emailValidation.textContent = '✗ This email is already registered';
      emailValid = false;
    } else if (!result.valid) {
      emailIcon.className = 'validation-icon invalid';
      emailIcon.innerHTML = '<i class="fas fa-exclamation-circle"></i>';
      emailValidation.className = 'validation-message show warning';
      emailValidation.textContent = result.message || 'Invalid email';
      emailValid = false;
    }
    updateSaveButton();
  }

  function updateSaveButton() {
    // Check if ANY field has changed
    const usernameChanged = usernameInput.value !== originalUsername;
    const emailChanged = emailInput.value !== originalEmail;
    const realNameChanged = realNameInput.value !== originalRealName;
    const bioChanged = bioInput.value !== originalBio;
    
    const hasChanges = usernameChanged || emailChanged || realNameChanged || bioChanged;
    const canSave = usernameValid && emailValid && hasChanges;
    
    saveBtn.disabled = !canSave;
  }

  // ===== SETUP VALIDATION LISTENERS =====

  function setupValidation() {
    usernameInput.addEventListener('input', function() {
      const value = this.value;
      
      usernameIcon.className = 'validation-icon loading';
      usernameIcon.innerHTML = '<i class="fas fa-spinner"></i>';
      usernameValidation.className = 'validation-message show info';
      usernameValidation.textContent = 'Checking availability...';
      
      clearTimeout(usernameTimeout);
      usernameTimeout = setTimeout(async () => {
        const formatResult = validateUsernameFormat(value);
        if (!formatResult.valid) {
          updateUsernameValidation(formatResult);
          return;
        }
        
        const availability = await checkUsernameAvailability(value);
        updateUsernameValidation({
          valid: formatResult.valid,
          available: availability.available,
          isOriginal: availability.isOriginal || false,
          message: formatResult.message
        });
      }, 500);
    });

    emailInput.addEventListener('input', function() {
      const value = this.value.trim();
      
      emailIcon.className = 'validation-icon loading';
      emailIcon.innerHTML = '<i class="fas fa-spinner"></i>';
      emailValidation.className = 'validation-message show info';
      emailValidation.textContent = 'Checking availability...';
      
      clearTimeout(emailTimeout);
      emailTimeout = setTimeout(async () => {
        const formatResult = validateEmailFormat(value);
        if (!formatResult.valid) {
          updateEmailValidation(formatResult);
          return;
        }
        
        const availability = await checkEmailAvailability(value);
        updateEmailValidation({
          valid: formatResult.valid,
          available: availability.available,
          isOriginal: availability.isOriginal || false,
          message: formatResult.message
        });
      }, 500);
    });

    usernameInput.addEventListener('blur', function() {
      const value = this.value.trim();
      if (value && value.length >= 3) {
        const formatResult = validateUsernameFormat(value);
        if (formatResult.valid) {
          this.dispatchEvent(new Event('input'));
        }
      }
    });

    emailInput.addEventListener('blur', function() {
      const value = this.value.trim();
      if (value && value.includes('@')) {
        const formatResult = validateEmailFormat(value);
        if (formatResult.valid) {
          this.dispatchEvent(new Event('input'));
        }
      }
    });
    
    // Also trigger save button update when Real Name or Bio changes
    realNameInput.addEventListener('input', updateSaveButton);
    bioInput.addEventListener('input', updateSaveButton);
  }

  // ===== AUTH & LOAD USER DATA =====

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      alert("You must be logged in to edit your profile.");
      window.location.href = `universal-login.html?platform=poetry&redirect=${encodeURIComponent(window.location.href)}`;
      return;
    }

    currentUserUid = user.uid;

    const userRef = doc(db, "users", user.uid);
    const userDoc = await getDoc(userRef);

    if (userDoc.exists()) {
      const data = userDoc.data();
      realNameInput.value = data.realName || "";
      originalRealName = data.realName || "";
      usernameInput.value = data.username || "";
      originalUsername = data.username || "";
      emailInput.value = data.email || "";
      originalEmail = data.email || "";
      bioInput.value = data.bio || "";
      originalBio = data.bio || "";
    } else {
      await setDoc(userRef, { 
        realName: "",
        username: user.displayName || "", 
        email: user.email, 
        bio: "" 
      });
      realNameInput.value = "";
      originalRealName = "";
      usernameInput.value = user.displayName || "";
      originalUsername = user.displayName || "";
      emailInput.value = user.email || "";
      originalEmail = user.email || "";
      bioInput.value = "";
      originalBio = "";
    }

    usernameValid = true;
    emailValid = true;
    
    usernameIcon.className = 'validation-icon valid';
    usernameIcon.innerHTML = '<i class="fas fa-check-circle"></i>';
    usernameValidation.className = 'validation-message show success';
    usernameValidation.textContent = '✓ Current username';
    
    emailIcon.className = 'validation-icon valid';
    emailIcon.innerHTML = '<i class="fas fa-check-circle"></i>';
    emailValidation.className = 'validation-message show success';
    emailValidation.textContent = '✓ Current email';
    
    updateSaveButton();
    setupValidation();
  });

  // ===== SAVE PROFILE =====

  saveBtn.addEventListener("click", async () => {
    if (!currentUserUid) return;

    const newRealName = realNameInput.value.trim();
    const newUsername = usernameInput.value.trim();
    const newEmail = emailInput.value.trim();
    const newBio = bioInput.value.trim();

    if (!newUsername || !newEmail) {
      errorMsg.textContent = "Username and Email are required!";
      errorMsg.style.display = "block";
      successMsg.style.display = "none";
      return;
    }

    const usernameCheck = await checkUsernameAvailability(newUsername);
    if (!usernameCheck.available && newUsername !== originalUsername) {
      errorMsg.textContent = 'Username "' + newUsername + '" is already taken.';
      errorMsg.style.display = "block";
      successMsg.style.display = "none";
      return;
    }

    const emailCheck = await checkEmailAvailability(newEmail);
    if (!emailCheck.available && newEmail !== originalEmail) {
      errorMsg.textContent = 'Email "' + newEmail + '" is already registered.';
      errorMsg.style.display = "block";
      successMsg.style.display = "none";
      return;
    }

    saveBtn.disabled = true;
    errorMsg.style.display = "none";
    successMsg.style.display = "none";

    try {
      const userRef = doc(db, "users", currentUserUid);
      await updateDoc(userRef, {
        realName: newRealName,
        username: newUsername,
        email: newEmail,
        bio: newBio
      });

      originalRealName = newRealName;
      originalBio = newBio;
      originalUsername = newUsername;
      originalEmail = newEmail;
      
      successMsg.style.display = "block";
      successMsg.textContent = "✅ Profile updated successfully!";
      
      usernameValid = true;
      emailValid = true;
      updateSaveButton();

      setTimeout(() => {
        successMsg.style.display = "none";
      }, 5000);

    } catch (err) {
      console.error("Error updating profile:", err);
      errorMsg.textContent = "Failed to update profile. Try again.";
      errorMsg.style.display = "block";
    } finally {
      saveBtn.disabled = false;
    }
  });
</script>

<script>
(function() {
  function setupDynamicAuthLinks() {
    const currentPage = window.location.href;
    const currentFile = window.location.pathname.split('/').pop();
    let platform = 'poetry';
    if (currentFile.startsWith('store/')) platform = 'reads';
    if (currentFile === 'parent-house.html') platform = 'foundry';
    
    const loginParams = new URLSearchParams();
    loginParams.append('platform', platform);
    loginParams.append('redirect', currentPage);
    
    document.querySelectorAll('a[href*="universal-login.html"]').forEach(link => {
      link.href = `universal-login.html?${loginParams.toString()}`;
    });
    
    document.querySelectorAll('a[href*="universal-signup.html"]').forEach(link => {
      link.href = `universal-signup.html?${loginParams.toString()}`;
    });
  }
  
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', setupDynamicAuthLinks);
  } else {
    setupDynamicAuthLinks();
  }
})();
</script>
<script src="return-url-handler.js"></script>
