<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0">
    <title>Volant Reads · Reader</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="../images/volant-reads-favicon.png" />
    <link rel="apple-touch-icon" href="../images/volant-reads-favicon.png" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', sans-serif;
            background: #f5f2ed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .reader-header {
            background: white;
            padding: 0.8rem 2rem;
            border-bottom: 1px solid #ede7df;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 0.8rem;
            min-height: 60px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        
        .reader-header .book-info h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 600;
            color: #2d2a24;
            max-width: 300px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .reader-header .book-info p {
            font-size: 1rem;
            color: #6f6252;
        }
        
        .reader-header .controls {
            display: flex;
            gap: 0.6rem;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .reader-header .controls button {
            padding: 0.4rem 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
            background: #f0ebe4;
            color: #2d2a24;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        
        .reader-header .controls button:hover {
            background: #e6dfd6;
            transform: translateY(-1px);
        }
        
        .reader-header .controls button.primary {
            background: #4b2aad;
            color: white;
        }
        
        .reader-header .controls button.primary:hover {
            background: #3a1f8a;
        }
        
        .reader-header .controls button.refresh-btn {
            background: #e8f0fe;
            color: #1a56db;
            border: 1px solid #d2e3fc;
        }
        
        .reader-header .controls button.refresh-btn:hover {
            background: #d2e3fc;
        }
        
        .reader-header .controls button.refresh-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .reader-header .controls button.share-btn {
            background: #25D366;
            color: white;
            border: 1px solid #128C7E;
        }
        
        .reader-header .controls button.share-btn:hover {
            background: #128C7E;
        }
        
        #readerStatus {
            display: none !important;
        }
        
        #readerStatus.offline-available {
            display: inline-flex !important;
            background: #e8f0fe !important;
            color: #1a56db !important;
            border-color: #d2e3fc !important;
            padding: 0.2rem 0.8rem !important;
            border-radius: 20px !important;
            font-size: 0.8rem !important;
            align-items: center !important;
            gap: 4px !important;
        }
        
        #readerStatus.offline-available i {
            display: inline-block !important;
        }
        
        .offline-status {
            font-size: 0.7rem;
            padding: 0.2rem 0.8rem;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-weight: 500;
        }
        
        .offline-status.online {
            background: #dff7e5;
            color: #15723d;
            border: 1px solid #a8d5b5;
        }
        
        .offline-status.offline {
            background: #fde8e8;
            color: #b33;
            border: 1px solid #f5c6cb;
        }
        
        .offline-status i { font-size: 0.65rem; }
        
        .btn-save-offline {
            background: #4b2aad !important;
            color: white !important;
        }
        
        .btn-save-offline:hover { background: #3a1f8a !important; }
        .btn-save-offline.saved { background: #2d7d46 !important; }
        .btn-save-offline.saved:hover { background: #1f5f33 !important; }
        
        #readerDownloadBtn.btn-download-disabled {
            opacity: 0.5 !important;
            cursor: not-allowed !important;
            background: #ccc !important;
            color: #666 !important;
            pointer-events: none !important;
        }
        
        #readerDownloadBtn.btn-download-disabled:hover {
            transform: none !important;
            background: #ccc !important;
        }
        
        .share-dropdown {
            position: relative;
            display: inline-block;
        }
        
        .share-dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            background: white;
            min-width: 200px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            border-radius: 12px;
            padding: 8px 0;
            z-index: 1000;
            margin-top: 4px;
            border: 1px solid #ede7df;
        }
        
        .share-dropdown-content.show {
            display: block;
        }
        
        .share-dropdown-content .share-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            color: #2d2a24;
            font-size: 0.85rem;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            font-family: 'Inter', sans-serif;
        }
        
        .share-dropdown-content .share-item:hover {
            background: #f8f5f0;
        }
        
        .share-dropdown-content .share-item i {
            width: 20px;
            font-size: 1.1rem;
            text-align: center;
        }
        
        .share-dropdown-content .share-item .fa-whatsapp { color: #25D366; }
        .share-dropdown-content .share-item .fa-twitter { color: #1DA1F2; }
        .share-dropdown-content .share-item .fa-facebook { color: #1877F2; }
        .share-dropdown-content .share-item .fa-envelope { color: #D44638; }
        .share-dropdown-content .share-item .fa-copy { color: #4b2aad; }
        .share-dropdown-content .share-item .fa-link { color: #6f6252; }
        
        @media (max-width: 480px) {
            .share-dropdown-content {
                right: auto;
                left: 50%;
                transform: translateX(-50%);
                min-width: 180px;
            }
            .share-dropdown-content .share-item {
                padding: 8px 12px;
                font-size: 0.8rem;
            }
            .share-dropdown-content .share-item i {
                font-size: 1rem;
                width: 18px;
            }
        }
        
        .reader-zoom-hint {
            background: #f8f5f0;
            padding: 0.4rem 1rem;
            border-bottom: 1px solid #ede7df;
            text-align: center;
            font-size: 0.75rem;
            color: #6f6252;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .reader-zoom-hint i { color: #4b2aad; font-size: 0.85rem; }
        .reader-zoom-hint .hint-icon {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: white;
            padding: 0.15rem 0.6rem;
            border-radius: 12px;
            border: 1px solid #ede7df;
            font-weight: 500;
            font-size: 0.75rem;
        }
        .reader-zoom-hint .hint-icon i { font-size: 0.75rem; color: #4b2aad; }
        .reader-zoom-hint .desktop-hint { display: inline-flex !important; }
        .reader-zoom-hint .mobile-hint { display: none !important; }
        
        @media (max-width: 1024px) {
            .reader-zoom-hint { display: flex !important; }
            .reader-zoom-hint .desktop-hint { display: none !important; }
            .reader-zoom-hint .mobile-hint { display: inline-flex !important; }
        }
        
        .reader-content {
            flex: 1;
            padding: 1rem 1.5rem;
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
            background: white;
            min-height: calc(100vh - 110px);
            box-shadow: 0 2px 20px rgba(0,0,0,0.04);
        }
        
        .pdf-viewer-wrapper {
            position: relative;
            width: 100%;
            height: 85vh;
            min-height: 500px;
            background: #f5f2ed;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }
        
        .pdf-viewer-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }
        
        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 60vh;
            gap: 1.2rem;
        }
        
        .loading-state .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #ede7df;
            border-top: 4px solid #4b2aad;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-state p { color: #8a7b6a; font-weight: 500; }
        
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 0.8rem 1.5rem;
            border-radius: 12px;
            color: white;
            font-weight: 500;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 1000;
            background: #4b2aad;
            font-size: 0.9rem;
            max-width: 90%;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { background: #2d7d46; }
        .toast.error { background: #b76e4b; }
        .toast.info { background: #4b2aad; }
        
        .not-owned-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 60vh;
            text-align: center;
            padding: 2rem;
        }
        
        .not-owned-state i {
            font-size: 4rem;
            color: #cbb9a8;
            margin-bottom: 1rem;
        }
        
        .not-owned-state h3 {
            font-size: 1.5rem;
            color: #2d2a24;
            margin-bottom: 0.5rem;
        }
        
        .not-owned-state p {
            color: #6f6252;
            max-width: 400px;
            margin-bottom: 1.5rem;
        }
        
        .btn-back {
            display: inline-block;
            padding: 0.8rem 2rem;
            background: #4b2aad;
            color: white;
            text-decoration: none;
            border-radius: 40px;
            font-weight: 600;
            transition: 0.3s;
        }
        
        .btn-back:hover {
            background: #3a1f8a;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(75,42,173,0.3);
        }
        
        .btn-back i { margin-right: 8px; }
        
        @media (max-width: 768px) {
            .reader-content { padding: 0.5rem 0.5rem; }
            .pdf-viewer-wrapper { height: 78vh; min-height: 380px; border-radius: 4px; }
        }
        
        @media (max-width: 480px) {
            .reader-content { padding: 0.3rem 0.3rem; }
            .pdf-viewer-wrapper { height: 75vh; min-height: 350px; border-radius: 4px; }
        }
        
        @media (max-width: 765px) {
            .reader-header {
                padding: 0.6rem 1rem;
                flex-direction: column;
                align-items: stretch;
                gap: 0.5rem;
                min-height: auto;
            }
            .reader-header .book-info {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                width: 100%;
            }
            .reader-header .book-info h2 {
                font-size: 1.2rem;
                max-width: 100%;
                white-space: normal;
                overflow: visible;
                text-overflow: unset;
            }
            .reader-header .book-info p { font-size: 1.01rem; }
            .reader-header .controls { justify-content: flex-start; gap: 0.4rem; flex-wrap: wrap; }
            .reader-header .controls button { padding: 0.35rem 0.8rem; font-size: 0.75rem; }
            .reader-content { padding: 0.8rem 0.8rem; max-width: 100%; min-height: calc(100vh - 130px); }
        }
        
        @media (max-width: 480px) {
            #readerStatus.offline-available {
                font-size: 0.65rem !important;
                padding: 0.1rem 0.4rem !important;
                gap: 2px !important;
            }
            #readerStatus.offline-available i {
                font-size: 0.60rem !important;
            }
        }
        
        @media (max-width: 380px) {
            #readerStatus.offline-available {
                font-size: 0.55rem !important;
                padding: 0.05rem 0.3rem !important;
                gap: 2px !important;
            }
            #readerStatus.offline-available i {
                font-size: 0.50rem !important;
            }
        }
        
        .reader-zoom-hint a[href="dashboard.html#library"] {
            margin-left: 16px;
        }
        
        /* Mobile: Show a button to open PDF in external viewer */
        .mobile-pdf-btn {
            display: none;
            width: 100%;
            padding: 16px;
            background: #4b2aad;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
            text-align: center;
        }
        
        .mobile-pdf-btn:hover {
            background: #3a1f8a;
            transform: scale(1.02);
        }
        
        @media (max-width: 768px) {
            .mobile-pdf-btn {
                display: block;
            }
            .pdf-viewer-wrapper {
                display: none;
            }
        }
        
        .pdf-viewer-wrapper.mobile-visible {
            display: block !important;
        }
    </style>
</head>
<body>
    <div class="reader-header">
        <div class="book-info">
            <h2 id="readerBookTitle">Loading book...</h2>
            <p id="readerBookAuthor">Author</p>
        </div>
        <div class="controls">
            <span class="offline-status online" id="offlineStatus">
                <i class="fas fa-wifi"></i> Online
            </span>
            <span id="readerStatus">
                <i class="fas fa-check-circle"></i> Owned
            </span>
            <button onclick="refreshBook()" class="refresh-btn" id="refreshBtn" title="Refresh book data from server">
                <i class="fas fa-sync-alt"></i>
            </button>
            
            <div class="share-dropdown">
                <button onclick="toggleShareDropdown()" class="share-btn" id="shareBtn" title="Share this book">
                    <i class="fas fa-share-alt"></i>
                </button>
                <div class="share-dropdown-content" id="shareDropdown">
                    <button class="share-item" onclick="shareBook('whatsapp')">
                        <i class="fab fa-whatsapp"></i> WhatsApp
                    </button>
                    <button class="share-item" onclick="shareBook('twitter')">
                        <i class="fab fa-twitter"></i> Twitter
                    </button>
                    <button class="share-item" onclick="shareBook('facebook')">
                        <i class="fab fa-facebook"></i> Facebook
                    </button>
                    <button class="share-item" onclick="shareBook('email')">
                        <i class="fas fa-envelope"></i> Email
                    </button>
                    <button class="share-item" onclick="shareBook('copy')">
                        <i class="fas fa-copy"></i> Copy Link
                    </button>
                    <button class="share-item" onclick="shareBook('native')">
                        <i class="fas fa-share-alt"></i> Share via...
                    </button>
                </div>
            </div>
            
            <button onclick="saveForOffline()" id="saveOfflineBtn" class="btn-save-offline">
                <i class="fas fa-download"></i>
            </button>
            <button onclick="downloadBook()" id="readerDownloadBtn">
                <i class="fas fa-download"></i>
            </button>
            <button onclick="window.close()" class="primary">
                <i class="fas fa-times"></i>
            </button>
        </div>
    </div>
    
    <div class="reader-zoom-hint">
        <i class="fas fa-search-plus"></i>
        <span>Zoom:</span>
        <span class="hint-icon desktop-hint">
            <i class="fas fa-mouse"></i> Ctrl + Scroll
        </span>
        <span class="hint-icon mobile-hint">
            <i class="fas fa-hand-pinch"></i> Pinch
        </span>
        <a href="dashboard.html#library" style="color:#4b2aad; text-decoration:none; font-weight:500; font-size:0.75rem;">
            <i class="fas fa-book-open"></i> My Library
        </a>
    </div>
    
    <div class="reader-content" id="readerContent">
        <div class="loading-state">
            <div class="spinner"></div>
            <p>Loading book content...</p>
        </div>
    </div>
    
    <div class="toast" id="toast"></div>
    
    <script type="importmap">
    {
        "imports": {
            "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"
        }
    }
    </script>
    <script type="module">
        import { initializeApp } from "firebase/app";
        import { 
            getFirestore, 
            doc, 
            getDoc, 
            updateDoc, 
            increment, 
            serverTimestamp,
            setDoc
        } from "firebase/firestore";
        import { getAuth, onAuthStateChanged } from "firebase/auth";
        
        const firebaseConfig = {
            apiKey: "AIzaSyC4DHI8aBVY4JjTvJ-r-TGIDPsewtEWxzU",
            authDomain: "silent-depth.firebaseapp.com",
            projectId: "silent-depth",
            storageBucket: "silent-depth.appspot.com",
            messagingSenderId: "78008755450",
            appId: "1:78008755450:web:3fd0f0f298a08820935543"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        let currentUser = null;
        let currentBook = null;
        let downloadLimit = 5;
        let isOffline = false;
        let isLoading = false;
        
        const urlParams = new URLSearchParams(window.location.search);
        const bookId = urlParams.get('id');
        
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            if (!toast) return;
            toast.textContent = message;
            toast.className = `toast ${type}`;
            void toast.offsetWidth;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 4000);
        }
        
        async function getUserDownloadCount(userId, bookId) {
            try {
                const purchaseRef = doc(db, "purchases", `${userId}_${bookId}`);
                const purchaseSnap = await getDoc(purchaseRef);
                if (purchaseSnap.exists()) {
                    return purchaseSnap.data().downloadCount || 0;
                }
                return 0;
            } catch (err) {
                return 0;
            }
        }
        
        async function recordUserDownload(userId, bookId) {
            try {
                const purchaseRef = doc(db, "purchases", `${userId}_${bookId}`);
                const purchaseSnap = await getDoc(purchaseRef);
                
                if (purchaseSnap.exists()) {
                    await updateDoc(purchaseRef, {
                        downloadCount: increment(1),
                        lastDownloadedAt: serverTimestamp()
                    });
                } else {
                    await setDoc(purchaseRef, {
                        userId: userId,
                        bookId: bookId,
                        status: 'completed',
                        verified: true,
                        purchasedAt: serverTimestamp(),
                        downloadCount: 1,
                        lastDownloadedAt: serverTimestamp(),
                        transactionRef: 'free_book',
                        amount: 0,
                        currency: currentBook?.pricing?.currency || 'GHS',
                        customerEmail: currentUser?.email || '',
                        paymentMethod: 'free'
                    }, { merge: true });
                }
                return true;
            } catch (err) {
                return false;
            }
        }
        
        async function canUserDownload(userId, bookId, limit) {
            if (limit === 'unlimited' || limit === 'Unlimited') return true;
            const maxLimit = parseInt(limit);
            if (isNaN(maxLimit) || maxLimit < 1) return true;
            const count = await getUserDownloadCount(userId, bookId);
            return count < maxLimit;
        }
        
        async function trackDailyDownload(bookId) {
            if (!bookId) return;
            try {
                const today = new Date().toISOString().split('T')[0];
                const docId = `${bookId}_${today}`;
                const dailyRef = doc(db, "dailyDownloads", docId);
                await setDoc(dailyRef, {
                    bookId: bookId,
                    date: today,
                    downloads: increment(1),
                    lastUpdated: serverTimestamp()
                }, { merge: true });
            } catch (err) {}
        }
        
        async function checkPurchaseStatus(userId, bookId) {
            const offlinePurchases = JSON.parse(localStorage.getItem('volant_offline_purchases') || '{}');
            if (offlinePurchases[bookId] === true) {
                return true;
            }
            
            if (navigator.onLine) {
                try {
                    const purchaseRef = doc(db, "purchases", `${userId}_${bookId}`);
                    const purchaseSnap = await getDoc(purchaseRef);
                    if (purchaseSnap.exists()) {
                        const isPurchased = purchaseSnap.data().status === 'completed' && purchaseSnap.data().verified === true;
                        if (isPurchased) {
                            offlinePurchases[bookId] = true;
                            localStorage.setItem('volant_offline_purchases', JSON.stringify(offlinePurchases));
                        }
                        return isPurchased;
                    }
                } catch (err) {}
            }
            return false;
        }
        
        function saveBookToLocalStorage(bookData) {
            try {
                const offlineBooks = JSON.parse(localStorage.getItem('volant_offline_books_data') || '{}');
                offlineBooks[bookData.id] = {
                    title: bookData.title,
                    authorName: bookData.authorName,
                    pdfUrl: bookData.pdfUrl,
                    content: bookData.content || '',
                    downloadLimit: bookData.downloadLimit,
                    savedAt: new Date().toISOString()
                };
                localStorage.setItem('volant_offline_books_data', JSON.stringify(offlineBooks));
                return true;
            } catch (err) {
                return false;
            }
        }
        
        function getBookFromLocalStorage(bookId) {
            try {
                const offlineBooks = JSON.parse(localStorage.getItem('volant_offline_books_data') || '{}');
                return offlineBooks[bookId] || null;
            } catch {
                return null;
            }
        }
        
        function clearBookFromLocalStorage(bookId) {
            try {
                const offlineBooks = JSON.parse(localStorage.getItem('volant_offline_books_data') || '{}');
                delete offlineBooks[bookId];
                localStorage.setItem('volant_offline_books_data', JSON.stringify(offlineBooks));
                return true;
            } catch (err) {
                return false;
            }
        }
        
        function isBookInLocalStorage(bookId) {
            return getBookFromLocalStorage(bookId) !== null;
        }
        
        function updateConnectionStatus() {
            const statusEl = document.getElementById('offlineStatus');
            if (navigator.onLine) {
                isOffline = false;
                statusEl.className = 'offline-status online';
                statusEl.innerHTML = '<i class="fas fa-wifi"></i> Online';
            } else {
                isOffline = true;
                statusEl.className = 'offline-status offline';
                statusEl.innerHTML = '<i class="fas fa-wifi-slash"></i> Offline';
            }
            
            const refreshBtn = document.getElementById('refreshBtn');
            if (refreshBtn) {
                refreshBtn.disabled = isOffline;
                refreshBtn.title = isOffline ? 'Cannot refresh while offline' : 'Refresh book data from server';
            }
        }
        
        window.addEventListener('online', () => {
            updateConnectionStatus();
            showToast('📶 Back online!', 'success');
            if (currentUser && currentBook) {
                updateDownloadButton();
            }
        });
        
        window.addEventListener('offline', () => {
            updateConnectionStatus();
            showToast('📶 You are offline. Reading cached content.', 'info');
        });
        
        async function updateDownloadButton() {
            if (!currentUser || !currentBook) {
                const downloadBtn = document.getElementById('readerDownloadBtn');
                if (downloadBtn) {
                    downloadBtn.disabled = true;
                    downloadBtn.classList.add('btn-download-disabled');
                }
                return;
            }
            
            const downloadBtn = document.getElementById('readerDownloadBtn');
            if (!downloadBtn) return;
            
            const purchased = await checkPurchaseStatus(currentUser.uid, bookId);
            if (!purchased) {
                downloadBtn.disabled = true;
                downloadBtn.classList.add('btn-download-disabled');
                return;
            }
            
            const limit = currentBook.downloadLimit || currentBook.downloads || 5;
            downloadLimit = limit;
            
            const canDownload = await canUserDownload(currentUser.uid, bookId, limit);
            
            if (canDownload || limit === 'unlimited' || limit === 'Unlimited') {
                downloadBtn.disabled = false;
                downloadBtn.classList.remove('btn-download-disabled');
                downloadBtn.title = 'Download';
                downloadBtn.innerHTML = '<i class="fas fa-download"></i>';
            } else {
                downloadBtn.disabled = true;
                downloadBtn.classList.add('btn-download-disabled');
                downloadBtn.title = 'Download limit reached';
                downloadBtn.innerHTML = '<i class="fas fa-download"></i>';
            }
        }
        
        async function checkOfflineAvailability() {
            const statusEl = document.getElementById('readerStatus');
            if (!statusEl) return;
            
            if (isBookInLocalStorage(bookId)) {
                const btn = document.getElementById('saveOfflineBtn');
                if (btn) {
                    btn.innerHTML = '<i class="fas fa-check-circle"></i>';
                    btn.className = 'btn-save-offline saved';
                    btn.disabled = true;
                }
                
                statusEl.innerHTML = '<i class="fas fa-check-circle"></i> Offline Available';
                statusEl.className = 'offline-available';
                statusEl.style.color = '#1a56db';
                statusEl.style.background = '#e8f0fe';
                statusEl.style.borderColor = '#d2e3fc';
                
                return true;
            }
            
            statusEl.className = '';
            statusEl.style.display = 'none';
            
            return false;
        }
        
        // ================================================================
        // ===== DISPLAY BOOK - SIMPLE APPROACH =====
        // ================================================================
        
        function displayBook() {
            const content = document.getElementById('readerContent');
            if (!content) return;
            
            if (currentBook.pdfUrl) {
                let pdfUrl = currentBook.pdfUrl.split('#')[0];
                const isMobile = window.innerWidth < 768 || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
                
                // Add fl_attachment:false for Cloudinary (works on desktop)
                if (pdfUrl.includes('cloudinary.com') && pdfUrl.includes('/raw/upload/')) {
                    pdfUrl = pdfUrl.replace('/raw/upload/', '/raw/upload/fl_attachment:false/');
                }
                
                // ===== MOBILE: Open in new tab/window (Google will handle it) =====
                if (isMobile) {
                    // Show a button to open the PDF
                    content.innerHTML = `
                        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:70vh;text-align:center;padding:2rem;">
                            <i class="fas fa-file-pdf" style="font-size:4rem;color:#b76e4b;margin-bottom:1rem;"></i>
                            <h3 style="color:#2d2a24;margin-bottom:0.5rem;">${currentBook.title || 'Book'}</h3>
                            <p style="color:#6f6252;margin-bottom:1.5rem;">Tap the button below to open the PDF in your browser.</p>
                            <button onclick="window.open('${pdfUrl}', '_blank')" 
                                    style="padding:16px 40px;background:#4b2aad;color:white;border:none;border-radius:40px;font-size:1.1rem;font-weight:600;cursor:pointer;transition:0.3s;box-shadow:0 4px 15px rgba(75,42,173,0.3);">
                                <i class="fas fa-book-open"></i> Read Book
                            </button>
                            <p style="color:#b0a496;font-size:0.8rem;margin-top:1rem;">
                                <i class="fas fa-info-circle"></i> Opens in your browser's PDF viewer
                            </p>
                        </div>
                    `;
                    return;
                }
                
                // ===== DESKTOP: Show in iframe =====
                content.innerHTML = `
                    <div class="pdf-viewer-wrapper" id="pdfWrapper">
                        <iframe src="${pdfUrl}#toolbar=0&navpanes=0&scrollbar=1" 
                                style="width:100%;height:100%;border:none;background:#fff;"
                                allow="autoplay"
                                id="pdfViewer"
                                loading="lazy">
                        </iframe>
                    </div>
                `;
                
                setTimeout(() => {
                    const wrapper = document.getElementById('pdfWrapper');
                    if (wrapper) {
                        const height = window.innerHeight - 160;
                        wrapper.style.height = Math.max(400, height) + 'px';
                    }
                }, 300);
                
            } else if (currentBook.content) {
                content.innerHTML = `
                    <div style="max-width:900px;margin:0 auto;padding:0.5rem 0;">
                        <div style="font-size:1.15rem;line-height:2;color:#2d2a24;white-space:pre-wrap;font-family:'Georgia',serif;">${currentBook.content}</div>
                    </div>
                `;
            } else {
                content.innerHTML = `
                    <div style="text-align:center;padding:4rem 2rem;">
                        <i class="fas fa-book-open" style="font-size:3rem;color:#cbb9a8;margin-bottom:1rem;"></i>
                        <h3>No content available</h3>
                        <p style="color:#6f6252;margin-top:0.5rem;">This book doesn't have readable content.</p>
                        <a href="index.html" class="btn-back" style="display:inline-block;margin-top:1.5rem;">
                            <i class="fas fa-arrow-left"></i> Back to Store
                        </a>
                    </div>
                `;
            }
        }
        
        // ================================================================
        // ===== SHARE FUNCTIONS =====
        // ================================================================
        
        function getBookUrl() {
            const baseUrl = window.location.origin + window.location.pathname.replace('reader.html', 'details.html');
            return `${baseUrl}?id=${bookId}`;
        }
        
        function getShareText() {
            const title = currentBook?.title || 'a book';
            const author = currentBook?.authorName || 'an author';
            return `📖 Check out "${title}" by ${author} on Volant Reads!`;
        }
        
        window.toggleShareDropdown = function() {
            const dropdown = document.getElementById('shareDropdown');
            if (dropdown) dropdown.classList.toggle('show');
        };
        
        document.addEventListener('click', function(e) {
            const dropdown = document.getElementById('shareDropdown');
            const shareBtn = document.getElementById('shareBtn');
            if (dropdown && shareBtn && !dropdown.contains(e.target) && !shareBtn.contains(e.target)) {
                dropdown.classList.remove('show');
            }
        });
        
        window.shareBook = function(platform) {
            const url = getBookUrl();
            const text = getShareText();
            const encodedUrl = encodeURIComponent(url);
            const encodedText = encodeURIComponent(text);
            
            let shareUrl = '';
            
            switch(platform) {
                case 'whatsapp':
                    shareUrl = `https://api.whatsapp.com/send?text=${encodedText}%20${encodedUrl}`;
                    break;
                case 'twitter':
                    shareUrl = `https://twitter.com/intent/tweet?text=${encodedText}&url=${encodedUrl}`;
                    break;
                case 'facebook':
                    shareUrl = `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}&quote=${encodedText}`;
                    break;
                case 'email':
                    shareUrl = `mailto:?subject=${encodedText}&body=Check%20out%20this%20book%3A%20${encodedUrl}`;
                    break;
                case 'copy':
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(url).then(() => {
                            showToast('✅ Link copied to clipboard!', 'success');
                        }).catch(() => {
                            fallbackCopy(url);
                        });
                    } else {
                        fallbackCopy(url);
                    }
                    const dropdown = document.getElementById('shareDropdown');
                    if (dropdown) dropdown.classList.remove('show');
                    return;
                case 'native':
                    if (navigator.share) {
                        navigator.share({
                            title: currentBook?.title || 'Volant Reads Book',
                            text: text,
                            url: url
                        }).then(() => {
                            console.log('✅ Shared successfully');
                        }).catch((err) => {
                            if (err.name !== 'AbortError') {
                                console.warn('Share cancelled or failed:', err);
                            }
                        });
                    } else {
                        showToast('📱 Native sharing not supported on this device. Try copying the link.', 'info');
                        fallbackCopy(url);
                    }
                    const dropdown = document.getElementById('shareDropdown');
                    if (dropdown) dropdown.classList.remove('show');
                    return;
                default:
                    showToast('❌ Invalid share option', 'error');
                    return;
            }
            
            if (shareUrl) {
                window.open(shareUrl, '_blank', 'width=600,height=500');
            }
            
            const dropdown = document.getElementById('shareDropdown');
            if (dropdown) dropdown.classList.remove('show');
        };
        
        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            textarea.style.left = '-9999px';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('✅ Link copied to clipboard!', 'success');
            } catch (err) {
                showToast('❌ Could not copy link. Please copy manually.', 'error');
            }
            document.body.removeChild(textarea);
        }
        
        // ================================================================
        // ===== REFRESH BOOK =====
        // ================================================================
        
        window.refreshBook = async function() {
            if (isLoading) return;
            if (isOffline) {
                showToast('📶 Cannot refresh while offline. Please connect to the internet.', 'error');
                return;
            }
            
            const refreshBtn = document.getElementById('refreshBtn');
            if (refreshBtn) {
                refreshBtn.disabled = true;
                refreshBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            }
            
            showToast('🔄 Refreshing book data...', 'info');
            
            try {
                clearBookFromLocalStorage(bookId);
                
                const bookRef = doc(db, "books", bookId);
                const bookSnap = await getDoc(bookRef);
                
                if (!bookSnap.exists()) {
                    showToast('❌ Book not found on server.', 'error');
                    if (refreshBtn) {
                        refreshBtn.disabled = false;
                        refreshBtn.innerHTML = '<i class="fas fa-sync-alt"></i>';
                    }
                    return;
                }
                
                const freshData = { id: bookSnap.id, ...bookSnap.data() };
                
                saveBookToLocalStorage({
                    id: freshData.id,
                    title: freshData.title,
                    authorName: freshData.authorName,
                    pdfUrl: freshData.pdfUrl,
                    content: freshData.content || '',
                    downloadLimit: freshData.downloadLimit || 5
                });
                
                currentBook = {
                    id: freshData.id,
                    title: freshData.title,
                    authorName: freshData.authorName,
                    pdfUrl: freshData.pdfUrl,
                    content: freshData.content || '',
                    downloadLimit: freshData.downloadLimit || 5
                };
                
                const titleEl = document.getElementById('readerBookTitle');
                const authorEl = document.getElementById('readerBookAuthor');
                if (titleEl) titleEl.textContent = currentBook.title || 'Untitled';
                if (authorEl) authorEl.textContent = currentBook.authorName || 'Anonymous';
                
                displayBook();
                await checkOfflineAvailability();
                await updateDownloadButton();
                
                showToast('✅ Book data refreshed!', 'success');
                
            } catch (err) {
                showToast('❌ Error refreshing book data', 'error');
            } finally {
                if (refreshBtn) {
                    refreshBtn.disabled = false;
                    refreshBtn.innerHTML = '<i class="fas fa-sync-alt"></i>';
                }
            }
        };
        
        // ================================================================
        // ===== SAVE FOR OFFLINE =====
        // ================================================================
        
        window.saveForOffline = async function() {
            if (!currentBook) {
                showToast('❌ No content to save.', 'error');
                return;
            }
            
            const btn = document.getElementById('saveOfflineBtn');
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            }
            
            try {
                saveBookToLocalStorage({
                    id: currentBook.id,
                    title: currentBook.title || 'Untitled',
                    authorName: currentBook.authorName || 'Anonymous',
                    pdfUrl: currentBook.pdfUrl || '',
                    content: currentBook.content || '',
                    downloadLimit: currentBook.downloadLimit || 5
                });
                
                if (currentBook.pdfUrl && 'caches' in window) {
                    try {
                        const response = await fetch(currentBook.pdfUrl);
                        if (response.ok) {
                            const cache = await caches.open('volant-reads-pdfs');
                            await cache.put(currentBook.pdfUrl, response.clone());
                        }
                    } catch (cacheErr) {}
                }
                
                showToast('✅ Book saved for offline reading! 📖', 'success');
                if (btn) {
                    btn.innerHTML = '<i class="fas fa-check-circle"></i>';
                    btn.className = 'btn-save-offline saved';
                    btn.disabled = true;
                }
                
                const statusEl = document.getElementById('readerStatus');
                if (statusEl) {
                    statusEl.innerHTML = '<i class="fas fa-check-circle"></i> Offline Available';
                    statusEl.className = 'offline-available';
                    statusEl.style.color = '#1a56db';
                    statusEl.style.background = '#e8f0fe';
                    statusEl.style.borderColor = '#d2e3fc';
                }
                
            } catch (err) {
                showToast('❌ Error saving for offline', 'error');
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-download"></i>';
                }
            }
        };
        
        // ================================================================
        // ===== DOWNLOAD BOOK =====
        // ================================================================
        
        window.downloadBook = async function() {
            if (!currentUser) {
                showToast('🔐 Please sign in to download.', 'error');
                return;
            }
            
            if (!currentBook || !currentBook.pdfUrl) {
                showToast('❌ No PDF available to download.', 'error');
                return;
            }
            
            const purchased = await checkPurchaseStatus(currentUser.uid, bookId);
            if (!purchased) {
                showToast('❌ You don\'t own this book. Please purchase it first.', 'error');
                return;
            }
            
            const canDownload = await canUserDownload(currentUser.uid, bookId, downloadLimit);
            if (!canDownload) {
                showToast('❌ Download limit reached. Please contact the author for more downloads.', 'error');
                return;
            }
            
            const btn = document.getElementById('readerDownloadBtn');
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            }
            
            let fileName = '';
            const title = currentBook.title ? currentBook.title.trim() : 'Untitled';
            const subtitle = currentBook.subtitle ? currentBook.subtitle.trim() : '';
            const author = currentBook.authorName ? currentBook.authorName.trim() : 'Unknown';
            
            if (subtitle) {
                fileName = `${title}, ${subtitle} - ${author}`;
            } else {
                fileName = `${title} - ${author}`;
            }
            
            fileName = fileName.replace(/[^a-z0-9 _\-,\.]/gi, '_').replace(/\s+/g, ' ').trim() + '.pdf';
            
            try {
                await recordUserDownload(currentUser.uid, bookId);
                
                const bookRef = doc(db, "books", bookId);
                await updateDoc(bookRef, {
                    downloads: increment(1)
                });
                
                await trackDailyDownload(bookId);
                
                const response = await fetch(currentBook.pdfUrl);
                if (!response.ok) throw new Error(`Download failed with status ${response.status}`);
                const blob = await response.blob();
                
                const downloadUrl = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = downloadUrl;
                link.download = fileName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(downloadUrl);
                
                await updateDownloadButton();
                
                showToast(`📄 Downloaded "${currentBook.title}"!`, 'success');
                
            } catch (err) {
                showToast('⚠️ Unable to download PDF. Please try again.', 'error');
            } finally {
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-download"></i>';
                }
            }
        };
        
        function registerServiceWorker() {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/store/sw.js')
                    .then(registration => {})
                    .catch(err => {});
            }
        }
        
        // ================================================================
        // ===== LOAD BOOK =====
        // ================================================================
        
        async function loadBook() {
            if (!bookId) {
                const content = document.getElementById('readerContent');
                if (content) {
                    content.innerHTML = '<p style="padding:2rem;text-align:center;">No book specified.</p>';
                }
                return;
            }
            
            if (isLoading) return;
            isLoading = true;
            
            const cachedBook = getBookFromLocalStorage(bookId);
            let bookData = null;
            let fromCache = false;
            
            const forceRefresh = urlParams.get('refresh') === 'true';
            
            if (navigator.onLine && !forceRefresh) {
                let shouldRefresh = false;
                if (cachedBook && cachedBook.savedAt) {
                    const savedTime = new Date(cachedBook.savedAt).getTime();
                    const now = Date.now();
                    const oneHour = 60 * 60 * 1000;
                    if (now - savedTime > oneHour) {
                        shouldRefresh = true;
                    }
                } else if (!cachedBook) {
                    shouldRefresh = true;
                }
                
                if (shouldRefresh) {
                    try {
                        const bookRef = doc(db, "books", bookId);
                        const bookSnap = await getDoc(bookRef);
                        
                        if (bookSnap.exists()) {
                            const freshData = { id: bookSnap.id, ...bookSnap.data() };
                            bookData = {
                                id: freshData.id,
                                title: freshData.title || 'Untitled',
                                authorName: freshData.authorName || 'Anonymous',
                                subtitle: freshData.subtitle || '',
                                pdfUrl: freshData.pdfUrl || '',
                                content: freshData.content || '',
                                downloadLimit: freshData.downloadLimit || 5,
                                price: freshData.pricing?.amount || 0,
                                currency: freshData.pricing?.currency || 'GHS'
                            };
                            
                            saveBookToLocalStorage(bookData);
                            fromCache = false;
                        }
                    } catch (err) {
                        console.warn('Could not fetch fresh data, using cache:', err);
                    }
                }
            }
            
            if (!bookData && cachedBook) {
                bookData = {
                    id: bookId,
                    title: cachedBook.title || 'Untitled',
                    authorName: cachedBook.authorName || 'Anonymous',
                    subtitle: cachedBook.subtitle || '',
                    pdfUrl: cachedBook.pdfUrl || '',
                    content: cachedBook.content || '',
                    downloadLimit: cachedBook.downloadLimit || 5,
                    price: cachedBook.price || 0,
                    currency: cachedBook.currency || 'GHS'
                };
                fromCache = true;
            }
            
            if (!bookData && navigator.onLine) {
                try {
                    const bookRef = doc(db, "books", bookId);
                    const bookSnap = await getDoc(bookRef);
                    
                    if (bookSnap.exists()) {
                        const freshData = { id: bookSnap.id, ...bookSnap.data() };
                        bookData = {
                            id: freshData.id,
                            title: freshData.title || 'Untitled',
                            authorName: freshData.authorName || 'Anonymous',
                            subtitle: freshData.subtitle || '',
                            pdfUrl: freshData.pdfUrl || '',
                            content: freshData.content || '',
                            downloadLimit: freshData.downloadLimit || 5,
                            price: freshData.pricing?.amount || 0,
                            currency: freshData.pricing?.currency || 'GHS'
                        };
                        
                        saveBookToLocalStorage(bookData);
                        fromCache = false;
                    }
                } catch (err) {
                    console.warn('Could not fetch from Firestore:', err);
                }
            }
            
            if (!bookData) {
                const content = document.getElementById('readerContent');
                if (content) {
                    content.innerHTML = `
                        <div class="not-owned-state">
                            <i class="fas fa-book-open"></i>
                            <h3>Book Not Available</h3>
                            <p>${isOffline ? 'You are offline. This book has not been saved for offline reading.' : 'The book you\'re looking for doesn\'t exist.'}</p>
                            <a href="index.html" class="btn-back" style="margin-top:1rem;"><i class="fas fa-arrow-left"></i> Back to Store</a>
                        </div>
                    `;
                }
                isLoading = false;
                return;
            }
            
            currentBook = bookData;
            downloadLimit = currentBook.downloadLimit || currentBook.downloads || 5;
            const bookPrice = currentBook.price || 0;
            
            const titleEl = document.getElementById('readerBookTitle');
            const authorEl = document.getElementById('readerBookAuthor');
            if (titleEl) titleEl.textContent = currentBook.title || 'Untitled';
            if (authorEl) authorEl.textContent = currentBook.authorName || 'Anonymous';
            
            const isFreeBook = bookPrice <= 0;
            let purchased = false;
            
            if (isFreeBook) {
                purchased = true;
                
                if (currentUser) {
                    try {
                        const purchaseRef = doc(db, "purchases", `${currentUser.uid}_${bookId}`);
                        const purchaseSnap = await getDoc(purchaseRef);
                        
                        if (!purchaseSnap.exists()) {
                            await setDoc(purchaseRef, {
                                userId: currentUser.uid,
                                bookId: bookId,
                                status: 'completed',
                                verified: true,
                                purchasedAt: serverTimestamp(),
                                transactionRef: 'free_book',
                                amount: 0,
                                currency: currentBook.currency || 'GHS',
                                customerEmail: currentUser.email || '',
                                paymentMethod: 'free',
                                downloadCount: 0,
                                lastDownloadedAt: null,
                                authorId: currentBook.submittedBy || null,
                                bookTitle: currentBook.title || null
                            });
                        }
                    } catch (err) {}
                }
            } else {
                if (!purchased && currentUser) {
                    purchased = await checkPurchaseStatus(currentUser.uid, bookId);
                }
                
                if (!purchased) {
                    const offlinePurchases = JSON.parse(localStorage.getItem('volant_offline_purchases') || '{}');
                    purchased = offlinePurchases[bookId] === true;
                }
            }
            
            if (purchased) {
                await checkOfflineAvailability();
                await updateDownloadButton();
                displayBook();
                
            } else {
                const content = document.getElementById('readerContent');
                if (content) {
                    content.innerHTML = `
                        <div class="not-owned-state">
                            <i class="fas fa-lock"></i>
                            <h3>You don't own this book</h3>
                            <p>Please purchase the book to read it online.</p>
                            <a href="details.html?id=${bookId}" class="btn-back">
                                <i class="fas fa-shopping-cart"></i> Buy Now
                            </a>
                        </div>
                    `;
                }
                
                const downloadBtn = document.getElementById('readerDownloadBtn');
                if (downloadBtn) {
                    downloadBtn.disabled = true;
                    downloadBtn.classList.add('btn-download-disabled');
                }
                
                const statusEl = document.getElementById('readerStatus');
                if (statusEl) {
                    statusEl.className = '';
                    statusEl.style.display = 'none';
                }
            }
            
            isLoading = false;
        }
        
        // ================================================================
        // ===== INIT =====
        // ================================================================
        
        registerServiceWorker();
        updateConnectionStatus();
        
        if (!navigator.onLine) {
            showToast('📶 You are offline. Loading from cache...', 'info');
        }
        
        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            await loadBook();
        });
    </script>
</body>
