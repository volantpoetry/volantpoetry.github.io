<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Volant Messenger</title>
  
  <link rel="stylesheet" href="style.css" />
<script>
    // Simple console blocker - production only
    (function() {
        if (window.location.hostname.includes('localhost') || 
            window.location.hostname.includes('127.0.0.1')) {
            return; // Allow in development
        }
        
        // Block all console methods
        var methods = ['log', 'info', 'warn', 'error', 'debug', 'trace', 'table', 'group', 'groupEnd', 'dir'];
        methods.forEach(function(m) {
            console[m] = function() {};
            try {
                Object.defineProperty(console, m, { configurable: false, writable: false });
            } catch(e) {}
        });
        
        window.onerror = function() { return true; };
        window.onunhandledrejection = function() { return true; };
    })();
</script>
  <!-- Favicons -->
  <link rel="icon" type="image/png" href="images/volant-favicon.png">
  <link rel="apple-touch-icon" href="images/volant-favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #f6f5fc 0%, #f0eef9 100%); min-height: 100vh; padding: 0; padding-top: 80px; padding-bottom: 40px; }

    /* ===== HEADER ===== */
    .header-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 2000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(75, 42, 173, 0.1);
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: #4b2aad;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .logo-text {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: #4b2aad;
      cursor: default;
      user-select: none;
    }

    .nav-logo-img {
      height: 36px;
      width: auto;
      object-fit: contain;
      cursor: default;
    }

    .logo .highlight {
      color: #ffffff;
      text-shadow: 0 0 2px #4b2aad, 0 0 4px #4b2aad, 0 0 6px #4b2aad;
    }

    .home-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      border-radius: 30px;
      background: #f5f0ff;
      color: #4b2aad;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.25s ease;
      border: none;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
    }

    .home-btn:hover {
      background: #4b2aad;
      color: #ffffff;
      transform: translateX(-2px);
      box-shadow: 0 4px 12px rgba(75, 42, 173, 0.3);
    }

    /* ===== CONTAINER ===== */
    .container { max-width: 1400px; margin: 0 auto; padding: 0 20px; }
    
    /* ===== MESSENGER ===== */
    .messenger-container { 
      display: flex; 
      gap: 0; 
      background: white; 
      border-radius: 24px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
      overflow: hidden; 
      min-height: 70vh; 
      height: calc(100vh - 140px); 
      border: 1px solid rgba(0,0,0,0.04); 
      position: relative;
    }
    
    /* ===== SIDEBAR TOGGLE BUTTON - FIXED ===== */
    .sidebar-toggle {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 100;
      background: white;
      border: 1px solid #e9e4ff;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
      color: #4b2aad;
      transition: all 0.3s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      flex-shrink: 0;
    }

    .sidebar-toggle:hover {
      background: #f0edff;
      transform: scale(1.05);
    }

    .sidebar-toggle:active {
      transform: scale(0.95);
    }

    /* ===== CONVERSATIONS SIDEBAR ===== */
    .conversations-sidebar { 
      width: 320px; 
      background: #faf9ff; 
      border-right: 1px solid #e9e4ff; 
      display: flex; 
      flex-direction: column; 
      overflow: hidden;
      transition: all 0.3s ease;
      flex-shrink: 0;
      padding-top: 56px; /* Space for toggle */
    }

    .conversations-sidebar.collapsed {
      width: 0 !important;
      min-width: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      border-right: none !important;
    }

    /* ===== SIDEBAR HEADER - FIXED ===== */
    .sidebar-header { 
      padding: 20px; 
      border-bottom: 1px solid #e9e4ff;
      text-align: center;
      flex-shrink: 0;
      background: #faf9ff;
      z-index: 5;
    }
    .sidebar-header h3 { 
      font-size: 1.1rem; 
      color: #1a1a1a; 
      margin-bottom: 12px;
      text-align: center;
    }
    
    .new-message-btn { 
      width: 100%; 
      background: #4b2aad; 
      color: white; 
      border: none; 
      padding: 10px; 
      border-radius: 40px; 
      font-weight: 600; 
      cursor: pointer; 
      transition: all 0.3s; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 8px; 
    }
    .new-message-btn:hover { background: #3a1f8a; transform: translateY(-2px); }
    
    /* ===== CONVERSATIONS LIST - SCROLLABLE ===== */
    .conversations-list { 
      flex: 1; 
      overflow-y: auto; 
      padding: 10px;
      min-height: 0;
    }
    .conversation-item { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 12px; cursor: pointer; transition: all 0.2s; margin-bottom: 4px; }
    .conversation-item:hover { background: #f0edff; }
    .conversation-item.active { background: #e9e4ff; border-left: 3px solid #4b2aad; }
    
    .conversation-avatar-img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: linear-gradient(135deg, #4b2aad, #7c5cbf); }
    .conversation-avatar-placeholder { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #4b2aad, #7c5cbf); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 1.2rem; flex-shrink: 0; }
    
    .conversation-info { flex: 1; min-width: 0; }
    .conversation-name { font-weight: 600; color: #1a1a1a; margin-bottom: 4px; display: flex; justify-content: space-between; }
    .conversation-last-msg { font-size: 0.75rem; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .unread-badge { background: #ff9800; color: white; border-radius: 30px; padding: 2px 8px; font-size: 0.7rem; font-weight: 600; }
    
    /* ===== CHAT AREA ===== */
    .chat-area { 
      flex: 1; 
      display: flex; 
      flex-direction: column; 
      background: white; 
      overflow: hidden; 
      min-width: 0;
      padding-top: 56px; /* Space for toggle */
    }
    
    /* ===== CHAT HEADER - FIXED ===== */
    .chat-header { 
      padding: 20px; 
      border-bottom: 1px solid #e9e4ff; 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      background: white;
      flex-shrink: 0;
      z-index: 5;
    }
    .chat-header-left { display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .chat-header-left:hover .chat-header-info h4 { color: #4b2aad; text-decoration: underline; }
    .chat-header-avatar-img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; }
    .chat-header-avatar-placeholder { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #4b2aad, #7c5cbf); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; }
    .chat-header-info h4 { font-size: 1rem; margin-bottom: 4px; }
    .chat-header-info p { font-size: 0.75rem; color: #888; }
    
    /* ===== MESSAGES - SCROLLABLE ===== */
    .messages-container { 
      flex: 1; 
      overflow-y: auto; 
      padding: 20px; 
      display: flex; 
      flex-direction: column; 
      gap: 12px; 
      background: #faf9ff;
      min-height: 0;
    }
    .message { display: flex; max-width: 70%; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .message.sent { align-self: flex-end; }
    .message.received { align-self: flex-start; }
    .message-bubble { padding: 10px 14px; border-radius: 18px; word-wrap: break-word; max-width: 100%; }
    .message.sent .message-bubble { background: #4b2aad; color: white; border-bottom-right-radius: 4px; }
    .message.received .message-bubble { background: white; color: #333; border: 1px solid #e9e4ff; border-bottom-left-radius: 4px; }
    .message-time { font-size: 0.65rem; margin-top: 4px; opacity: 0.7; text-align: right; }
    .message.sent .message-time { color: #ddd; }
    .message.received .message-time { color: #999; }
    
    /* Message date divider */
    .message-divider { text-align: center; font-size: 0.7rem; color: #999; padding: 8px 0; margin: 4px 0; }
    .message-divider span { background: #f0edff; padding: 4px 16px; border-radius: 20px; }
    
    /* ===== INPUT AREA - FIXED ===== */
    .message-input-area { 
      padding: 20px; 
      border-top: 1px solid #e9e4ff; 
      display: flex; 
      gap: 12px; 
      background: white; 
      align-items: flex-end;
      flex-shrink: 0;
      z-index: 5;
    }
    .message-input-area textarea { flex: 1; padding: 12px 16px; border: 1px solid #e9e4ff; border-radius: 24px; font-family: 'Inter', sans-serif; font-size: 0.95rem; outline: none; resize: vertical; min-height: 48px; max-height: 120px; line-height: 1.4; }
    .message-input-area textarea:focus { border-color: #4b2aad; }
    .send-btn { background: #4b2aad; color: white; border: none; padding: 0 24px; border-radius: 30px; font-weight: 600; cursor: pointer; height: 48px; transition: all 0.3s; }
    .send-btn:hover { background: #3a1f8a; transform: translateY(-2px); }
    
    .empty-chat { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; color: #aaa; gap: 12px; }
    .empty-chat span { font-size: 3rem; }
    
    /* ===== MODAL ===== */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); align-items: center; justify-content: center; z-index: 1000; }
    .modal.active { display: flex; }
    .modal-content { background: white; border-radius: 24px; padding: 28px; width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto; }
    .modal-content h3 { margin-bottom: 20px; color: #1a1a1a; }
    .search-users { width: 100%; padding: 12px; border: 1px solid #e9e4ff; border-radius: 30px; margin-bottom: 20px; }
    .users-list-modal { max-height: 300px; overflow-y: auto; }
    .user-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; cursor: pointer; transition: background 0.2s; }
    .user-item:hover { background: #f0edff; }
    .user-item-avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; }
    .user-item-avatar-placeholder { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #4b2aad, #7c5cbf); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; }
    .close-modal { margin-top: 20px; width: 100%; padding: 10px; background: #eee; border: none; border-radius: 30px; cursor: pointer; }
    .username-link { color: #4b2aad; text-decoration: none; font-weight: 500; }
    .username-link:hover { text-decoration: underline; }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      body { padding-top: 70px; }
      .header-bar { padding: 10px 16px; }
      .logo-text { font-size: 1.2rem; }
      .nav-logo-img { height: 28px; }
      .home-btn { font-size: 0.75rem; padding: 6px 14px; }
      .container { padding: 0 12px; }
      
      .messenger-container { 
        flex-direction: row; 
        height: auto; 
        min-height: 80vh; 
        border-radius: 16px;
        overflow: hidden;
        position: relative;
      }
      
      .conversations-sidebar { 
        position: relative;
        left: 0;
        width: 40% !important;
        height: 100% !important;
        max-height: none !important;
        z-index: 10;
        background: #faf9ff;
        border-right: 1px solid #e9e4ff;
        border-bottom: none;
        padding-top: 48px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        flex-shrink: 0;
      }
      
      .conversations-sidebar.collapsed {
        width: 0 !important;
        padding: 0 !important;
        overflow: hidden !important;
        border-right: none !important;
        margin: 0 !important;
      }
      
      .sidebar-header { 
        padding: 14px;
        flex-shrink: 0;
      }
      .sidebar-header h3 { font-size: 0.95rem; margin-bottom: 10px; }
      .new-message-btn { font-size: 0.8rem; padding: 8px; }
      
      .conversations-list { padding: 8px; }
      .conversation-item { padding: 10px 12px; }
      .conversation-avatar-img, .conversation-avatar-placeholder { width: 36px; height: 36px; font-size: 0.9rem; }
      .conversation-name { font-size: 0.85rem; }
      
      .chat-area { 
        min-height: 400px;
        padding-top: 0;
        flex: 1;
        width: auto;
      }
      
      .chat-header { padding: 14px 16px; }
      .chat-header-avatar-img, .chat-header-avatar-placeholder { width: 32px; height: 32px; font-size: 0.8rem; }
      .chat-header-info h4 { font-size: 0.9rem; }
      
      .messages-container { padding: 14px; gap: 8px; }
      .message { max-width: 85%; }
      .message-bubble { padding: 8px 12px; font-size: 0.9rem; }
      
      .message-input-area { padding: 12px; gap: 8px; flex-wrap: wrap; }
      .message-input-area textarea { min-height: 40px; padding: 10px 14px; font-size: 0.9rem; }
      .send-btn { height: 40px; padding: 0 16px; font-size: 0.85rem; }
      
      .sidebar-toggle { 
        position: absolute;
        top: 8px;
        left: 8px;
        width: 32px;
        height: 32px;
        font-size: 0.9rem;
        z-index: 20;
        background: white;
        border: 1px solid #e9e4ff;
        border-radius: 50%;
        color: #4b2aad;
        box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        display: flex !important;
      }
      
      .modal-content { padding: 20px; width: 95%; }
    }

    @media (max-width: 480px) {
      body { padding-top: 60px; padding-bottom: 20px; }
      .header-bar { padding: 8px 12px; }
      .logo-text { font-size: 1rem; }
      .nav-logo-img { height: 22px; }
      .home-btn { font-size: 0.7rem; padding: 5px 12px; }
      .container { padding: 0 8px; }
      
      .messenger-container { border-radius: 12px; min-height: 90vh; }
      
      .conversations-sidebar { 
        width: 40% !important;
        padding-top: 40px;
      }
      
      .conversations-sidebar.collapsed {
        width: 0 !important;
      }
      
      .sidebar-header { padding: 10px; }
      .sidebar-header h3 { font-size: 0.85rem; margin-bottom: 8px; }
      .new-message-btn { font-size: 0.7rem; padding: 6px; gap: 4px; }
      
      .conversation-item { padding: 8px 10px; gap: 8px; }
      .conversation-avatar-img, .conversation-avatar-placeholder { width: 30px; height: 30px; font-size: 0.7rem; }
      .conversation-name { font-size: 0.75rem; }
      .conversation-last-msg { font-size: 0.65rem; }
      
      .chat-area { padding-top: 0; }
      .chat-header { padding: 10px 12px; }
      .chat-header-avatar-img, .chat-header-avatar-placeholder { width: 28px; height: 28px; font-size: 0.7rem; }
      .chat-header-info h4 { font-size: 0.8rem; }
      .chat-header-info p { font-size: 0.65rem; }
      
      .messages-container { padding: 10px; gap: 6px; }
      .message { max-width: 90%; }
      .message-bubble { padding: 6px 10px; font-size: 0.8rem; }
      
      .message-input-area { padding: 10px; gap: 6px; }
      .message-input-area textarea { min-height: 36px; padding: 8px 10px; font-size: 0.8rem; }
      .send-btn { height: 36px; padding: 0 12px; font-size: 0.75rem; }
      
      .sidebar-toggle { 
        top: 6px;
        left: 6px;
        width: 28px;
        height: 28px;
        font-size: 0.8rem;
      }
    }

    /* ===== DESKTOP - SIDEBAR ALWAYS VISIBLE ===== */
    @media (min-width: 769px) {
      .sidebar-toggle { 
        display: flex !important;
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 100;
        background: white;
        border: 1px solid #e9e4ff;
        border-radius: 50%;
        width: 36px;
        height: 36px;
        font-size: 1.1rem;
        color: #4b2aad;
        box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      }
      
      .sidebar-toggle:hover {
        background: #f0edff;
        transform: scale(1.05);
      }
      
      .conversations-sidebar { 
        padding-top: 56px; 
        width: 320px !important;
        max-height: none !important;
        height: 100% !important;
        position: relative !important;
        left: 0 !important;
      }
      
      .conversations-sidebar.collapsed {
        width: 0 !important;
        padding: 0 !important;
        overflow: hidden !important;
        border-right: none !important;
        max-height: none !important;
      }
      
      .chat-area { padding-top: 56px; }
    }

    /* ===== FIX LOGO IMAGE ON DESKTOP ===== */
    .nav-logo-img {
      display: inline-block !important;
      visibility: visible !important;
      opacity: 1 !important;
    }

    
  /* ===== OVERRIDE - SAME BEHAVIOR ON ALL SCREENS ===== */
@media (max-width: 768px) {
  .messenger-container { 
    flex-direction: row !important;
    height: calc(100vh - 120px) !important;
    border-radius: 16px !important;
    min-height: 0 !important;
  }
  
  .conversations-sidebar { 
    width: 320px !important;
    min-width: 320px !important;
    max-height: none !important;
    height: 100% !important;
    padding-top: 48px !important;
    position: relative !important;
    left: 0 !important;
    flex: 0 0 320px !important;
  }
  
  .conversations-sidebar.collapsed {
    width: 0 !important;
    min-width: 0 !important;
    padding: 0 !important;
    border-right: none !important;
    overflow: hidden !important;
    flex: 0 0 0 !important;
  }
  
  .chat-area { 
    flex: 1 !important;
    min-height: 0 !important;
    padding-top: 0 !important;
    height: 100% !important;
  }
  
  .sidebar-toggle { 
    position: absolute !important;
    top: 8px !important;
    left: 8px !important;
    z-index: 20 !important;
    display: flex !important;
  }
}

@media (max-width: 480px) {
  .conversations-sidebar { 
    width: 280px !important;
    min-width: 280px !important;
    flex: 0 0 280px !important;
    padding-top: 40px !important;
  }
  
  .conversations-sidebar.collapsed {
    width: 0 !important;
    min-width: 0 !important;
    flex: 0 0 0 !important;
  }
  
  .messenger-container { 
    height: calc(100vh - 100px) !important;
  }
}

/* ===== RECENT CHATS - 40% ON SMALL SCREENS ===== */
@media (max-width: 659px) {
  .conversations-sidebar { 
    width: 40% !important;
    min-width: 40% !important;
    flex: 0 0 40% !important;
    max-width: 40% !important;
  }
  
  .conversations-sidebar.collapsed {
    width: 0 !important;
    min-width: 0 !important;
    flex: 0 0 0 !important;
    max-width: 0 !important;
    padding: 0 !important;
    border-right: none !important;
    overflow: hidden !important;
  }
  
  .chat-area { 
    flex: 1 !important;
    min-width: 0 !important;
  }
}

/* ===== USERNAME IN MESSAGES - DEEP GOLDEN COLOR ===== */

/* In conversation list */
.conversation-name {
  font-weight: 600;
  color: #B8860B; /* Deep golden color */
  margin-bottom: 4px;
  display: flex;
  justify-content: space-between;
  transition: color 0.2s ease;
}

.conversation-item:hover .conversation-name {
  color: #DAA520; /* Lighter gold on hover */
}

/* In chat header */
.chat-header-info h4 {
  font-size: 1rem;
  margin-bottom: 4px;
  color: #B8860B; /* Deep golden color */
  transition: color 0.2s ease;
}

.chat-header-left:hover .chat-header-info h4 {
  color: #DAA520 !important; /* Lighter gold on hover */
  text-decoration: none !important;
}

/* In message bubbles - sender name for received messages */
.message.received .message-bubble .sender-name {
  color: #B8860B;
  font-weight: 600;
  display: block;
  margin-bottom: 4px;
  transition: color 0.2s ease;
}

.message.received .message-bubble .sender-name:hover {
  color: #DAA520;
}

/* For the "You" in messages */
.message.sent .message-bubble .sender-name {
  color: #B8860B;
  font-weight: 600;
  display: block;
  margin-bottom: 4px;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 480px) {
  .conversation-name {
    font-size: 0.85rem;
  }
  
  .chat-header-info h4 {
    font-size: 0.9rem;
  }
}
    
  </style>
</head>
<body>

<!-- ===== HEADER ===== -->
<header class="header-bar">
  <div class="logo">
    <img src="images/logokk.png" alt="Volant Poetry Logo" class="nav-logo-img">
    <span class="logo-text">
      <span class="highlight">Volant</span> Poetry
    </span>
  </div>
  <a href="user-profile.html" class="home-btn">Back</a>
</header>

<div class="container">
  <div class="messenger-container">
    <!-- Sidebar Toggle Button -->
    <button class="sidebar-toggle" id="sidebarToggle" title="Toggle conversations">☰</button>
    
    <!-- Conversations Sidebar -->
    <div class="conversations-sidebar" id="conversationsSidebar">
      <div class="sidebar-header">
        <h3>Conversations</h3>
        <button id="newMessageBtn" class="new-message-btn">✏️ New Message</button>
      </div>
      <div id="conversationsList" class="conversations-list">Loading...</div>
    </div>
    
    <!-- Chat Area -->
    <div class="chat-area">
      <div id="chatHeader" class="chat-header">
        <div class="chat-header-left">
          <div class="chat-header-avatar-placeholder">✨</div>
          <div class="chat-header-info"><h4>Select a conversation</h4><p>Start messaging with fellow poets</p></div>
        </div>
      </div>
      <div id="messagesContainer" class="messages-container"><div class="empty-chat"><span>💬</span><p>Choose a conversation or start a new one</p></div></div>
      <div id="messageInputArea" class="message-input-area" style="display: none;">
        <textarea id="messageInput" placeholder="Write a message..." autocomplete="off" rows="1"></textarea>
        <button id="sendBtn" class="send-btn">Send</button>
      </div>
    </div>
  </div>
</div>

<!-- ===== MODAL ===== -->
<div id="newConversationModal" class="modal">
  <div class="modal-content">
    <h3>Start a new conversation</h3>
    <input type="text" id="searchUsers" class="search-users" placeholder="Search poets by name...">
    <div id="usersListModal" class="users-list-modal">Loading poets...</div>
    <button class="close-modal" id="closeModalBtn">Cancel</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { 
    getFirestore, 
    collection, 
    query, 
    where, 
    getDocs, 
    getDoc, 
    doc, 
    addDoc, 
    orderBy, 
    onSnapshot, 
    updateDoc, 
    setDoc, 
    serverTimestamp, 
    writeBatch,
    limit 
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC4DHI8aBVY4JjTvJ-r-TGIDPsewtEWxzU",
    authDomain: "silent-depth.firebaseapp.com",
    projectId: "silent-depth",
    storageBucket: "silent-depth.appspot.com",
    messagingSenderId: "78008755450",
    appId: "1:78008755450:web:3fd0f0f298a08820935543"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  let currentUser = null, currentConversationId = null, currentOtherUserId = null;
  let conversationsUnsubscribe = null, messagesUnsubscribe = null;
  let allUsersCache = [];
  let userCache = {};
  let usersLoaded = false;
  let sidebarCollapsed = false;
  let conversationsRendered = false;

  // ===== CACHE =====
  let conversationsCache = [];

  function getInitials(name) { return name ? name.charAt(0).toUpperCase() : '?'; }
  function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); }
  function formatTime(date) { const diff = Date.now() - date; if (diff < 60000) return 'Just now'; if (diff < 3600000) return `${Math.floor(diff/60000)}m`; if (diff < 86400000) return `${Math.floor(diff/3600000)}h`; return date.toLocaleDateString(); }

  function autoResizeTextarea(textarea) {
    textarea.style.height = 'auto';
    textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
  }

  // ===== BATCH GET USERS - 50 AT A TIME (MAXIMUM SPEED) =====
  async function getUsernamesBatched(userIds) {
    const uniqueIds = [...new Set(userIds.filter(id => id && id !== currentUser?.uid))];
    const results = {};
    const uncachedIds = [];
    
    for (const id of uniqueIds) {
      if (userCache[id]) {
        results[id] = userCache[id];
      } else {
        uncachedIds.push(id);
      }
    }
    
    if (uncachedIds.length > 0) {
      try {
        const chunkSize = 50; // ✅ MAXIMUM - FEWEST ROUND TRIPS
        for (let i = 0; i < uncachedIds.length; i += chunkSize) {
          const chunk = uncachedIds.slice(i, i + chunkSize);
          const promises = chunk.map(id => getDoc(doc(db, "users", id)));
          const snapshots = await Promise.all(promises);
          snapshots.forEach((snap, index) => {
            const id = chunk[index];
            if (snap.exists()) {
              const data = snap.data();
              userCache[id] = {
                uid: id,
                username: data.username || data.displayName || 'Anonymous Poet',
                photoURL: data.photoURL || null,
                email: data.email || ''
              };
              results[id] = userCache[id];
            } else {
              userCache[id] = { uid: id, username: 'Poet', photoURL: null };
              results[id] = userCache[id];
            }
          });
        }
      } catch (err) {
        console.warn('Error fetching users:', err);
        uncachedIds.forEach(id => {
          userCache[id] = { uid: id, username: 'Poet', photoURL: null };
          results[id] = userCache[id];
        });
      }
    }
    
    return results;
  }

  // ===== LOAD ALL USERS - CACHED =====
  async function loadAllUsers(forceRefresh = false) {
    if (!currentUser) return [];
    
    if (usersLoaded && allUsersCache.length > 0 && !forceRefresh) {
      return allUsersCache;
    }
    
    // Fetch following and users in parallel
    const [followingSnapshot, usersSnapshot] = await Promise.all([
      getDocs(query(collection(db, "social"), where("followerId", "==", currentUser.uid))),
      getDocs(collection(db, "users"))
    ]);
    
    const followedIds = new Set();
    followingSnapshot.forEach(doc => {
      const data = doc.data();
      if (data.followedId) followedIds.add(data.followedId);
    });
    
    const users = [];
    usersSnapshot.forEach(docSnap => { 
      if (docSnap.id !== currentUser.uid) {
        const data = docSnap.data();
        const userObj = { 
          uid: docSnap.id, 
          username: data.username || data.displayName || 'Anonymous Poet',
          photoURL: data.photoURL || null,
          email: data.email || '',
          isFollowing: followedIds.has(docSnap.id)
        };
        users.push(userObj);
        userCache[docSnap.id] = userObj;
      }
    });
    
    users.sort((a, b) => {
      if (a.isFollowing && !b.isFollowing) return -1;
      if (!a.isFollowing && b.isFollowing) return 1;
      return a.username.localeCompare(b.username);
    });
    
    allUsersCache = users;
    usersLoaded = true;
    return users;
  }

  async function getUserDetails(uid) {
    if (uid === currentUser?.uid) return { username: 'You', uid, photoURL: currentUser.photoURL };
    if (userCache[uid]) return userCache[uid];
    
    try { 
      const userDoc = await getDoc(doc(db, "users", uid)); 
      if (userDoc.exists()) {
        const data = userDoc.data();
        const userObj = { uid, username: data.username || data.displayName || 'Poet', photoURL: data.photoURL || null };
        userCache[uid] = userObj;
        return userObj;
      } 
    } catch(e) {}
    
    const fallback = { uid, username: 'Poet', photoURL: null };
    userCache[uid] = fallback;
    return fallback;
  }

  function getAvatarHtml(photoURL, username, size = '48px') {
    const initials = getInitials(username);
    if (photoURL && photoURL.startsWith('http')) {
      return `<img src="${escapeHtml(photoURL)}" class="conversation-avatar-img" style="width:${size}; height:${size};" onerror="this.style.display='none';this.parentElement.innerHTML='<div class=\\'conversation-avatar-placeholder\\' style=\\'width:${size}; height:${size};\\'>${initials}</div>';">`;
    }
    return `<div class="conversation-avatar-placeholder" style="width:${size}; height:${size};">${initials}</div>`;
  }

  function getSmallAvatarHtml(photoURL, username, size = '44px') {
    const initials = getInitials(username);
    if (photoURL && photoURL.startsWith('http')) {
      return `<img src="${escapeHtml(photoURL)}" class="chat-header-avatar-img" style="width:${size}; height:${size};" onerror="this.style.display='none';this.parentElement.innerHTML='<div class=\\'chat-header-avatar-placeholder\\' style=\\'width:${size}; height:${size};\\'>${initials}</div>';">`;
    }
    return `<div class="chat-header-avatar-placeholder" style="width:${size}; height:${size};">${initials}</div>`;
  }

  function getModalAvatarHtml(photoURL, username, size = '44px') {
    const initials = getInitials(username);
    if (photoURL && photoURL.startsWith('http')) {
      return `<img src="${escapeHtml(photoURL)}" class="user-item-avatar" style="width:${size}; height:${size};" onerror="this.style.display='none';this.parentElement.innerHTML='<div class=\\'user-item-avatar-placeholder\\' style=\\'width:${size}; height:${size};\\'>${initials}</div>';">`;
    }
    return `<div class="user-item-avatar-placeholder" style="width:${size}; height:${size};">${initials}</div>`;
  }

  async function getCurrentUserProfile() {
    const userDoc = await getDoc(doc(db, "users", currentUser.uid));
    if (userDoc.exists()) {
      const data = userDoc.data();
      currentUser.photoURL = data.photoURL || null;
      currentUser.displayName = data.username || data.displayName || currentUser.email?.split('@')[0];
      userCache[currentUser.uid] = { uid: currentUser.uid, username: currentUser.displayName, photoURL: currentUser.photoURL };
    } else {
      currentUser.displayName = currentUser.email?.split('@')[0] || 'Poet';
      currentUser.photoURL = null;
    }
  }

  function getConversationId(id1, id2) { return [id1, id2].sort().join('_'); }

  async function createOrGetConversation(otherUserId) {
    const convId = getConversationId(currentUser.uid, otherUserId);
    const convRef = doc(db, "conversations", convId);
    const convSnap = await getDoc(convRef);
    if (!convSnap.exists()) {
      const otherUser = await getUserDetails(otherUserId);
      await setDoc(convRef, { 
        participants: [currentUser.uid, otherUserId], 
        participantDetails: { 
          [currentUser.uid]: { username: currentUser.displayName || 'Me', photoURL: currentUser.photoURL || null },
          [otherUserId]: { username: otherUser.username, photoURL: otherUser.photoURL || null }
        }, 
        lastMessage: null, 
        lastMessageTime: null, 
        createdAt: serverTimestamp() 
      });
    }
    return convId;
  }

  // ===== GET UNREAD COUNT - CACHED =====
  const unreadCache = {};
  
  async function getUnreadCount(conversationId) {
    if (unreadCache[conversationId] !== undefined) return unreadCache[conversationId];
    try {
      const messagesSnap = await getDocs(collection(db, `conversations/${conversationId}/messages`));
      let unread = 0;
      messagesSnap.forEach(doc => { const data = doc.data(); if (!data.read && data.senderId !== currentUser.uid) unread++; });
      unreadCache[conversationId] = unread;
      return unread;
    } catch(e) { return 0; }
  }

  // ===== LOAD CONVERSATIONS - OPTIMIZED =====
  function loadConversations() {
    if (!currentUser) return;
    
    // Show cached conversations immediately
    if (conversationsCache.length > 0 && !conversationsRendered) {
      renderConversations(conversationsCache);
      conversationsRendered = true;
    }
    
    const conversationsQuery = query(
      collection(db, "conversations"), 
      where("participants", "array-contains", currentUser.uid), 
      orderBy("lastMessageTime", "desc"),
      limit(30)
    );
    
    if (conversationsUnsubscribe) conversationsUnsubscribe();
    
    conversationsUnsubscribe = onSnapshot(conversationsQuery, async (snapshot) => {
      const conversations = [];
      const userIds = new Set();
      
      snapshot.forEach(docSnap => {
        const convData = docSnap.data();
        const otherId = convData.participants.find(p => p !== currentUser.uid);
        if (otherId) userIds.add(otherId);
        conversations.push({ id: docSnap.id, convData, otherId });
      });
      
      // Batch fetch all user details at once - 50 per batch (MAX)
      const userMap = await getUsernamesBatched([...userIds]);
      
      const result = [];
      const unreadPromises = [];
      
      for (const conv of conversations) {
        const otherUser = userMap[conv.otherId] || { uid: conv.otherId, username: 'Poet', photoURL: null };
        result.push({
          id: conv.id,
          otherUser,
          lastMessage: conv.convData.lastMessage || '',
          lastMessageTime: conv.convData.lastMessageTime,
        });
        unreadPromises.push(getUnreadCount(conv.id));
      }
      
      const unreadCounts = await Promise.all(unreadPromises);
      result.forEach((conv, index) => {
        conv.unreadCount = unreadCounts[index] || 0;
      });
      
      conversationsCache = result;
      conversationsRendered = true;
      renderConversations(result);
    });
  }

  function renderConversations(conversations) {
    const container = document.getElementById('conversationsList');
    if (!container) return;
    if (conversations.length === 0) { 
      container.innerHTML = '<div style="text-align:center; padding:20px; color:#999;">💔 No conversations yet. Start a new one!</div>'; 
      return; 
    }
    
    container.innerHTML = conversations.map(conv => `
      <div class="conversation-item ${currentConversationId === conv.id ? 'active' : ''}" data-conv-id="${conv.id}" data-other-uid="${conv.otherUser.uid}">
        ${getAvatarHtml(conv.otherUser.photoURL, conv.otherUser.username, '48px')}
        <div class="conversation-info">
          <div class="conversation-name">
            <span>${escapeHtml(conv.otherUser.username)}</span>
            ${conv.unreadCount > 0 ? `<span class="unread-badge">${conv.unreadCount}</span>` : ''}
          </div>
          <div class="conversation-last-msg">${escapeHtml(conv.lastMessage?.substring(0, 40) || 'No messages yet')}</div>
        </div>
      </div>
    `).join('');
    
    document.querySelectorAll('.conversation-item').forEach(el => { 
      el.addEventListener('click', () => { 
        openConversation(el.dataset.convId, el.dataset.otherUid); 
      }); 
    });
  }

  async function openConversation(conversationId, otherUserId) {
    currentConversationId = conversationId;
    currentOtherUserId = otherUserId;
    
    document.querySelectorAll('.conversation-item').forEach(el => el.classList.remove('active'));
    document.querySelector(`.conversation-item[data-conv-id="${conversationId}"]`)?.classList.add('active');
    
    const otherUser = await getUserDetails(otherUserId);
    document.getElementById('chatHeader').innerHTML = `
      <div class="chat-header-left" data-uid="${otherUser.uid}">
        ${getSmallAvatarHtml(otherUser.photoURL, otherUser.username, '44px')}
        <div class="chat-header-info">
          <h4>${escapeHtml(otherUser.username)}</h4>
          <p>✍️ Poet</p>
        </div>
      </div>
    `;
    
    document.querySelector('.chat-header-left')?.addEventListener('click', () => {
      window.location.href = `user-profile.html?uid=${otherUser.uid}`;
    });
    
    document.getElementById('messageInputArea').style.display = 'flex';
    const textarea = document.getElementById('messageInput');
    textarea.value = '';
    textarea.style.height = 'auto';
    loadMessages(conversationId);
    await markMessagesAsRead(conversationId);
  }

  async function markMessagesAsRead(conversationId) {
    if (!conversationId) return;
    try {
      const messagesSnap = await getDocs(collection(db, `conversations/${conversationId}/messages`));
      const batch = writeBatch(db);
      let hasUnread = false;
      messagesSnap.forEach(docSnap => { 
        const data = docSnap.data(); 
        if (!data.read && data.senderId !== currentUser.uid) {
          batch.update(doc(db, `conversations/${conversationId}/messages`, docSnap.id), { read: true });
          hasUnread = true;
        }
      });
      if (hasUnread) {
        await batch.commit();
        unreadCache[conversationId] = 0;
        const badge = document.querySelector(`.conversation-item[data-conv-id="${conversationId}"] .unread-badge`);
        if (badge) badge.remove();
      }
    } catch(e) { console.warn("Error marking messages as read:", e); }
  }

  function loadMessages(conversationId) {
    if (messagesUnsubscribe) messagesUnsubscribe();
    const messagesQuery = query(collection(db, `conversations/${conversationId}/messages`), orderBy("timestamp", "asc"));
    messagesUnsubscribe = onSnapshot(messagesQuery, (snapshot) => {
      const messages = [];
      snapshot.forEach(docSnap => messages.push({ id: docSnap.id, ...docSnap.data() }));
      renderMessages(messages);
      if (currentConversationId === conversationId) {
        markMessagesAsRead(conversationId);
      }
    });
  }

  function renderMessages(messages) {
    const container = document.getElementById('messagesContainer');
    if (!container) return;
    if (messages.length === 0) { container.innerHTML = '<div class="empty-chat"><span>💌</span><p>Send a message to start the conversation!</p></div>'; return; }
    
    let lastDate = null;
    let html = '';
    
    messages.forEach(msg => { 
      const msgDate = msg.timestamp?.toDate ? msg.timestamp.toDate() : new Date(msg.timestamp);
      const dateStr = msgDate.toLocaleDateString();
      
      if (dateStr !== lastDate) {
        lastDate = dateStr;
        const today = new Date();
        const yesterday = new Date(today);
        yesterday.setDate(yesterday.getDate() - 1);
        let displayDate = dateStr;
        if (dateStr === today.toLocaleDateString()) displayDate = 'Today';
        else if (dateStr === yesterday.toLocaleDateString()) displayDate = 'Yesterday';
        html += `<div class="message-divider"><span>${displayDate}</span></div>`;
      }
      
      const isSent = msg.senderId === currentUser.uid; 
      const time = msg.timestamp?.toDate ? formatTime(msg.timestamp.toDate()) : formatTime(new Date(msg.timestamp)); 
      const status = isSent ? (msg.read ? '✓✓' : '✓') : '';
      
      html += `<div class="message ${isSent ? 'sent' : 'received'}">
        <div class="message-bubble-wrapper">
          <div class="message-bubble">
            ${escapeHtml(msg.text)}
            <div class="message-time">${time} ${status ? `<span class="message-status">${status}</span>` : ''}</div>
          </div>
        </div>
      </div>`; 
    });
    
    container.innerHTML = html;
    container.scrollTop = container.scrollHeight;
  }

  async function sendMessage() {
    const textarea = document.getElementById('messageInput');
    const text = textarea.value.trim();
    if (!text || !currentConversationId) return;
    const convRef = doc(db, "conversations", currentConversationId);
    await addDoc(collection(db, `conversations/${currentConversationId}/messages`), { 
      text, 
      senderId: currentUser.uid, 
      timestamp: serverTimestamp(), 
      read: false 
    });
    await updateDoc(convRef, { lastMessage: text, lastMessageTime: serverTimestamp() });
    textarea.value = '';
    textarea.style.height = 'auto';
    textarea.focus();
  }

  // ===== SHOW NEW CONVERSATION MODAL =====
  async function showNewConversationModal() {
    const modal = document.getElementById('newConversationModal');
    const usersListDiv = document.getElementById('usersListModal');
    const searchInput = document.getElementById('searchUsers');
    
    usersListDiv.innerHTML = '<div style="padding:12px; color:#999;">Loading poets...</div>';
    modal.classList.add('active');
    
    const users = await loadAllUsers();
    
    function renderUserList(filter = '') {
      const filtered = users.filter(u => u.username.toLowerCase().includes(filter.toLowerCase()));
      if (filtered.length === 0) { usersListDiv.innerHTML = '<div style="padding:12px; color:#999;">No poets found</div>'; return; }
      usersListDiv.innerHTML = filtered.map(user => `
        <div class="user-item" data-uid="${user.uid}" data-username="${escapeHtml(user.username)}">
          ${getModalAvatarHtml(user.photoURL, user.username, '44px')}
          <div>
            <div style="font-weight:500; display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
              ${escapeHtml(user.username)}
              ${user.isFollowing ? '<span style="background:#4b2aad; color:white; padding:1px 10px; border-radius:12px; font-size:0.6rem; font-weight:600;">Following</span>' : ''}
            </div>
            <div style="font-size:0.7rem; color:#888;">${user.isFollowing ? '✍️ Following' : 'Poet'}</div>
          </div>
        </div>
      `).join('');
      document.querySelectorAll('.user-item').forEach(el => { 
        el.addEventListener('click', async () => { 
          const otherUid = el.dataset.uid; 
          if (otherUid === currentUser.uid) {
            alert("You cannot send a message to yourself.");
            return;
          }
          const convId = await createOrGetConversation(otherUid); 
          modal.classList.remove('active'); 
          openConversation(convId, otherUid); 
          loadConversations(); 
        }); 
      });
    }
    renderUserList();
    searchInput.value = '';
    searchInput.oninput = (e) => renderUserList(e.target.value);
  }

  // ===== SIDEBAR TOGGLE =====
  function toggleSidebar() {
    const sidebar = document.getElementById('conversationsSidebar');
    const toggleBtn = document.getElementById('sidebarToggle');
    
    sidebar.classList.toggle('collapsed');
    toggleBtn.innerHTML = sidebar.classList.contains('collapsed') ? '☰' : '☰';
  }

  // ===== AUTH =====
  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = "universal-login.html?platform=poetry&redirect=messages.html"; return; }
    currentUser = user;
    await getCurrentUserProfile();
    loadConversations();
    
    document.getElementById('sidebarToggle').addEventListener('click', toggleSidebar);
    
    document.getElementById('newMessageBtn').addEventListener('click', showNewConversationModal);
    document.getElementById('closeModalBtn').addEventListener('click', () => document.getElementById('newConversationModal').classList.remove('active'));
    document.getElementById('sendBtn').addEventListener('click', sendMessage);
    const textarea = document.getElementById('messageInput');
    textarea.addEventListener('keypress', (e) => { 
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    textarea.addEventListener('input', function() { autoResizeTextarea(this); });
    document.getElementById('newConversationModal').addEventListener('click', (e) => { 
      if (e.target === document.getElementById('newConversationModal')) 
        document.getElementById('newConversationModal').classList.remove('active'); 
    });
  });
</script>
<script>
(function() {
  function setupDynamicAuthLinks() {
    const currentPage = window.location.href;
    const currentFile = window.location.pathname.split('/').pop();
    let platform = 'poetry';
    if (currentFile.startsWith('store/')) platform = 'reads';
    if (currentFile === 'parent-house.html') platform = 'foundry';
    
    const loginParams = new URLSearchParams();
    loginParams.append('platform', platform);
    loginParams.append('redirect', currentPage);
    
    document.querySelectorAll('a[href*="universal-login.html"]').forEach(link => {
      link.href = `universal-login.html?${loginParams.toString()}`;
    });
    
    document.querySelectorAll('a[href*="universal-signup.html"]').forEach(link => {
      link.href = `universal-signup.html?${loginParams.toString()}`;
    });
  }
  
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', setupDynamicAuthLinks);
  } else {
    setupDynamicAuthLinks();
  }
})();
</script>
<script src="return-url-handler.js"></script>
