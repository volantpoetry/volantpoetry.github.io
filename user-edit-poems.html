<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Edit My Poems | Volant Poetry</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@700&display=swap" rel="stylesheet">
  
<!-- Favicons -->
<link rel="icon" type="image/png" href="images/volant-favicon.png">
<link rel="apple-touch-icon" href="images/volant-favicon.png">

<style>
:root {
  --primary: #4b2aad;
  --primary-light: #6f4ae4;
  --bg-start: #ff9a9e;
  --bg-mid: #fad0c4;
  --bg-end: #a18cd1;
  --text: #1a1a1a;
  --muted: #6b6b6b;
  --radius: 14px;
  --success: #28a745;
  --warning: #ffc107;
  --danger: #dc3545;
}

* { box-sizing: border-box; }
body {
  font-family: 'Inter', sans-serif;
  background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-mid) 50%, var(--bg-end) 100%);
  color: var(--text);
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0;
  padding-top: 80px;
  padding-bottom: 40px;
}

/* ===== FLOATING ELEMENTS ===== */
.floating {
  position: fixed;
  font-size: 2rem;
  color: rgba(255,255,255,0.5);
  animation: float 12s linear infinite alternate;
  user-select: none;
  pointer-events: none;
  z-index: 0;
}
@keyframes float {
  0% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-25px) rotate(10deg); }
  100% { transform: translateY(0) rotate(-10deg); }
}

/* ===== HEADER ===== */
.header-bar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 2000;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 24px;
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(75, 42, 173, 0.1);
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
}

.logo {
  font-family: 'Playfair Display', serif;
  font-size: 1.6rem;
  font-weight: 700;
  color: #4b2aad;
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 4px;
}

.logo-text {
  font-family: 'Playfair Display', serif;
  font-size: 1.6rem;
  font-weight: 700;
  color: #4b2aad;
  cursor: default;
  user-select: none;
}

.nav-logo-img {
  height: 36px;
  width: auto;
  object-fit: contain;
  cursor: default;
}

.logo .highlight {
  color: #ffffff;
  text-shadow: 0 0 2px #4b2aad, 0 0 4px #4b2aad, 0 0 6px #4b2aad;
}

.home-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 18px;
  border-radius: 30px;
  background: #f5f0ff;
  color: #4b2aad;
  text-decoration: none;
  font-weight: 600;
  font-size: 0.9rem;
  transition: all 0.25s ease;
  border: none;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
}

.home-btn:hover {
  background: #4b2aad;
  color: #ffffff;
  transform: translateX(-2px);
  box-shadow: 0 4px 12px rgba(75, 42, 173, 0.3);
}

/* ===== CONTAINER ===== */
.container {
  width: 90%;
  max-width: 1200px;
  margin: 0 auto;
  position: relative;
  z-index: 1;
}
/* ===== PAGE HEADER - FORCED ===== */
.page-header {
  display: flex !important;
  justify-content: center !important;
  align-items: center !important;
  margin-bottom: 30px !important;
  flex-wrap: wrap !important;
  gap: 20px !important;
}

.page-header h1 {
  font-family: 'Playfair Display', serif !important;
  color: #4b2aad !important;
  margin: 0 !important;
  font-size: 2rem !important;
  text-align: center !important;
}

/* ===== RESPONSIVE - FORCED ===== */
@media (max-width: 768px) {
  .page-header {
    gap: 15px !important;
    margin-bottom: 25px !important;
  }
  
  .page-header h1 {
    font-size: 1.6rem !important;
  }
}

@media (max-width: 480px) {
  .page-header {
    gap: 12px !important;
    margin-bottom: 20px !important;
  }
  
  .page-header h1 {
    font-size: 1.3rem !important;
  }
}


/* ===== SEARCH AND FILTER ===== */
.search-filter-bar {
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(8px);
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  margin-bottom: 30px;
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  align-items: center;
  border: 1px solid rgba(255,255,255,0.3);
}

.search-box {
  flex: 2;
  min-width: 250px;
  position: relative;
}

.search-box input {
  width: 100%;
  padding: 12px 20px;
  border: 2px solid #e8e4f0;
  border-radius: 30px;
  font-size: 1rem;
  padding-left: 45px;
  background: rgba(255,255,255,0.95) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%234b2aad" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>') no-repeat 15px center;
  background-size: 20px;
  font-family: 'Inter', sans-serif;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.search-box input:focus {
  outline: none;
  border-color: #4b2aad;
  box-shadow: 0 0 0 4px rgba(75, 42, 173, 0.1);
}

.filter-options {
  flex: 1;
  min-width: 200px;
  display: flex;
  gap: 10px;
}

.filter-options select {
  flex: 1;
  padding: 12px;
  border: 2px solid #e8e4f0;
  border-radius: 8px;
  font-family: 'Inter', sans-serif;
  background: rgba(255,255,255,0.95);
  cursor: pointer;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.filter-options select:focus {
  outline: none;
  border-color: #4b2aad;
  box-shadow: 0 0 0 4px rgba(75, 42, 173, 0.1);
}

/* ===== POEMS GRID ===== */
.poems-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 25px;
  margin-top: 30px;
}

@media (min-width: 768px) {
  .poems-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (min-width: 1200px) {
  .poems-grid {
    grid-template-columns: repeat(3, 1fr);
  }
}

/* ===== POEM CARD ===== */
.poem-edit-card {
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(10px);
  border-radius: 16px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
  overflow: hidden;
  transition: transform 0.2s, box-shadow 0.2s;
  border: 1px solid rgba(255,255,255,0.3);
}

.poem-edit-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 25px rgba(75, 42, 173, 0.15);
}

.poem-edit-header {
  background: linear-gradient(135deg, #4b2aad, #6c3ddd);
  color: white;
  padding: 15px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.poem-edit-header h3 {
  margin: 0;
  font-size: 1.2rem;
  font-weight: 600;
  font-family: 'Playfair Display', serif;
  max-width: 70%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.poem-date-badge {
  font-size: 0.75rem;
  background: rgba(255,255,255,0.2);
  padding: 4px 8px;
  border-radius: 20px;
  white-space: nowrap;
}

.poem-edit-body {
  padding: 20px;
}

/* ===== FORM ELEMENTS ===== */
.form-group {
  margin-bottom: 20px;
}

.form-group label {
  display: block;
  margin-bottom: 8px;
  font-weight: 600;
  color: #4b2aad;
  font-size: 0.9rem;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.form-group input,
.form-group textarea,
.form-group select {
  width: 100%;
  padding: 10px 12px;
  border: 2px solid #e8e4f0;
  border-radius: 8px;
  font-family: 'Inter', sans-serif;
  font-size: 0.95rem;
  transition: border-color 0.2s, box-shadow 0.2s;
  box-sizing: border-box;
  background: rgba(255,255,255,0.95);
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus {
  outline: none;
  border-color: #4b2aad;
  box-shadow: 0 0 0 4px rgba(75, 42, 173, 0.1);
}

.form-group textarea {
  min-height: 150px;
  resize: vertical;
}

/* ===== CATEGORIES ===== */
.categories-container {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 10px;
}

.category-tag {
  background: #f0ece6;
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 0.85rem;
  display: flex;
  align-items: center;
  gap: 8px;
  border: 1px solid #e0d8d0;
}

.category-tag .remove-cat {
  cursor: pointer;
  color: #999;
  font-weight: bold;
  font-size: 1.2rem;
  line-height: 1;
  transition: color 0.2s;
}

.category-tag .remove-cat:hover {
  color: var(--danger);
}

.add-category {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.add-category input {
  flex: 1;
  padding: 8px 12px;
  border: 2px solid #e8e4f0;
  border-radius: 8px;
  font-family: 'Inter', sans-serif;
  background: rgba(255,255,255,0.95);
}

.add-category input:focus {
  outline: none;
  border-color: #4b2aad;
  box-shadow: 0 0 0 4px rgba(75, 42, 173, 0.1);
}

.add-category button {
  background: #4b2aad;
  color: white;
  border: none;
  border-radius: 8px;
  padding: 8px 16px;
  cursor: pointer;
  font-weight: 500;
  transition: background 0.2s, transform 0.2s;
  font-family: 'Inter', sans-serif;
}

.add-category button:hover {
  background: #6c3ddd;
  transform: translateY(-2px);
}

/* ===== STATS ===== */
.stats-preview {
  display: flex;
  gap: 20px;
  margin: 15px 0;
  padding: 15px;
  background: rgba(248, 248, 248, 0.8);
  border-radius: 8px;
}

.stat-item {
  text-align: center;
  flex: 1;
}

.stat-value {
  font-size: 1.3rem;
  font-weight: 700;
  color: #4b2aad;
  display: block;
}

.stat-label {
  font-size: 0.8rem;
  color: var(--muted);
  text-transform: uppercase;
}

/* ===== BUTTONS ===== */
.poem-actions {
  display: flex;
  gap: 12px;
  margin-top: 20px;
  padding-top: 20px;
  border-top: 2px solid rgba(0,0,0,0.06);
}

.btn {
  padding: 10px 16px;
  border: none;
  border-radius: 8px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  font-size: 0.95rem;
  flex: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-family: 'Inter', sans-serif;
}

.btn-success {
  background: #28a745;
  color: white;
}

.btn-success:hover {
  background: #218838;
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3);
}

.btn-danger {
  background: #dc3545;
  color: white;
}

.btn-danger:hover {
  background: #c82333;
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(220, 53, 69, 0.3);
}

.btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none !important;
}

/* ===== STATUS ===== */
.save-status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.9rem;
  margin-top: 10px;
}

.save-status.saved {
  color: #28a745;
}

.save-status.error {
  color: #dc3545;
}

/* ===== TOAST ===== */
.toast {
  position: fixed;
  bottom: 30px;
  right: 30px;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(8px);
  color: var(--text);
  padding: 15px 25px;
  border-radius: 8px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  display: none;
  align-items: center;
  gap: 10px;
  z-index: 1000;
  animation: slideIn 0.3s ease;
  border-left: 4px solid var(--success);
  max-width: 400px;
}

.toast.error {
  border-left-color: var(--danger);
}

.toast.warning {
  border-left-color: var(--warning);
}

@keyframes slideIn {
  from {
    transform: translateX(100%);
    opacity: 0;
  }
  to {
    transform: translateX(0);
    opacity: 1;
  }
}

/* ===== LOADING / EMPTY ===== */
.loading-spinner {
  text-align: center;
  padding: 40px;
  color: var(--muted);
  background: rgba(255,255,255,0.8);
  border-radius: 16px;
}

.no-poems {
  text-align: center;
  padding: 60px 20px;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(8px);
  border-radius: 16px;
  color: var(--muted);
  border: 1px solid rgba(255,255,255,0.3);
}

.no-poems p {
  font-size: 1.2rem;
  margin-bottom: 20px;
}

.no-poems .btn {
  display: inline-block;
  width: auto;
  padding: 12px 30px;
  text-decoration: none;
  background: #4b2aad;
  color: white;
  border-radius: 8px;
  font-weight: 500;
  transition: all 0.2s;
}

.no-poems .btn:hover {
  background: #6c3ddd;
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(75, 42, 173, 0.3);
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  body {
    padding-top: 70px;
  }
  
  .container {
    width: 95%;
    margin: 0 auto;
  }
  
  .page-header {
    flex-direction: column;
    align-items: flex-start;
  }
  
  .page-header h1 {
    font-size: 1.6rem;
  }
  
  .header-bar {
    padding: 10px 16px;
  }
  
  .logo-text {
    font-size: 1.2rem;
  }
  
  .nav-logo-img {
    height: 28px;
  }
  
  .home-btn {
    font-size: 0.75rem;
    padding: 6px 14px;
  }
  
  .poem-actions {
    flex-direction: column;
  }
  
  .toast {
    left: 20px;
    right: 20px;
    bottom: 20px;
  }
  
  .search-filter-bar {
    flex-direction: column;
  }
  
  .search-box {
    min-width: 100%;
  }
  
  .filter-options {
    min-width: 100%;
  }
  
  .floating {
    font-size: 1.5rem;
  }
}

@media (max-width: 480px) {
  body {
    padding-top: 60px;
    padding-bottom: 20px;
  }
  
  .header-bar {
    padding: 8px 12px;
  }
  
  .logo-text {
    font-size: 1rem;
  }
  
  .nav-logo-img {
    height: 22px;
  }
  
  .home-btn {
    font-size: 0.7rem;
    padding: 5px 12px;
  }
  
  .container {
    width: 98%;
  }
  
  .page-header h1 {
    font-size: 1.3rem;
  }
  
  .poem-edit-header h3 {
    font-size: 1rem;
    max-width: 60%;
  }
  
  .stats-preview {
    flex-direction: column;
    gap: 10px;
  }
  
  .floating {
    font-size: 1.2rem;
  }
}
</style>
</head>
<body>

<!-- ===== FLOATING ELEMENTS ===== -->
<div class="floating" style="top: 12%; left: 4%;">✒️</div>
<div class="floating" style="top: 22%; right: 6%;">📜</div>
<div class="floating" style="top: 72%; left: 8%;">⭐</div>
<div class="floating" style="top: 55%; left: 50%;">🖋️</div>
<div class="floating" style="top: 85%; right: 10%;">🌙</div>

<!-- ===== HEADER ===== -->
<header class="header-bar">
  <div class="logo">
    <img src="images/logokk.png" alt="Volant Poetry Logo" class="nav-logo-img">
    <span class="logo-text">
      <span class="highlight">Volant</span> Poetry
    </span>
  </div>
  <a href="user-profile.html" class="home-btn">Home</a>
</header>

<!-- ===== MAIN CONTENT ===== -->
<div class="container">
  <div class="page-header">
    <h1> Edit My Poems</h1>
  </div>

  <!-- Search and Filter Bar -->
  <div class="search-filter-bar">
    <div class="search-box">
      <input type="text" id="searchPoems" placeholder="Search by title or content..." autocomplete="off">
    </div>
    <div class="filter-options">
      <select id="sortOrder">
        <option value="newest">Newest First</option>
        <option value="oldest">Oldest First</option>
        <option value="mostLiked">Most Liked</option>
        <option value="mostCommented">Most Commented</option>
        <option value="alphabetical">Alphabetical</option>
      </select>
    </div>
  </div>

  <!-- Poems Grid -->
  <div id="poemsGrid" class="poems-grid">
    <div class="loading-spinner">Loading your poems...</div>
  </div>
</div>

<!-- Toast Notification -->
<div id="toast" class="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { 
  getFirestore, doc, getDoc, updateDoc, collection, 
  query, where, getDocs, deleteDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyC4DHI8aBVY4JjTvJ-r-TGIDPsewtEWxzU",
  authDomain: "silent-depth.firebaseapp.com",
  projectId: "silent-depth",
  storageBucket: "silent-depth.appspot.com",
  messagingSenderId: "78008755450",
  appId: "1:78008755450:web:3fd0f0f298a08820935543"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

// DOM Elements
const poemsGrid = document.getElementById('poemsGrid');
const searchInput = document.getElementById('searchPoems');
const sortSelect = document.getElementById('sortOrder');
const toast = document.getElementById('toast');

// State
let currentUser = null;
let userPoems = [];
let filteredPoems = [];
let username = '';

// Initialize
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = `universal-login.html?platform=poetry&redirect=${encodeURIComponent(window.location.href)}`;
    return;
  }

  currentUser = user;
  
  // Get username
  const userDoc = await getDoc(doc(db, 'users', user.uid));
  if (userDoc.exists()) {
    username = userDoc.data().username || user.email.split('@')[0];
  } else {
    username = user.email.split('@')[0];
  }

  await loadUserPoems();
});

// Load all poems by current user
async function loadUserPoems() {
  try {
    poemsGrid.innerHTML = '<div class="loading-spinner">Loading your poems...</div>';
    
    const poemsRef = collection(db, 'recentPoems');
    const q = query(poemsRef, where('submittedBy', '==', username));
    const snapshot = await getDocs(q);
    
    userPoems = [];
    
    for (const docSnap of snapshot.docs) {
      const poemData = docSnap.data();
      
      // Get comment count
      let commentCount = 0;
      try {
        const commentsSnap = await getDocs(collection(db, 'recentPoems', docSnap.id, 'comments'));
        commentCount = commentsSnap.size;
      } catch (err) {
        commentCount = Array.isArray(poemData.comments) ? poemData.comments.length : 0;
      }
      
      userPoems.push({
        id: docSnap.id,
        ...poemData,
        commentCount,
        categories: poemData.categories || [],
        timestamp: poemData.timestamp?.seconds ? new Date(poemData.timestamp.seconds * 1000) : new Date()
      });
    }
    
    // Sort and display
    applyFiltersAndSort();
    
  } catch (err) {
    console.error('Error loading poems:', err);
    poemsGrid.innerHTML = `<div class="no-poems">
      <p>Error loading poems: ${err.message}</p>
      <button class="btn" onclick="location.reload()" style="background:#4b2aad;color:white;border:none;padding:12px 30px;border-radius:8px;cursor:pointer;font-weight:500;">Try Again</button>
    </div>`;
  }
}

// Apply search filter and sorting
function applyFiltersAndSort() {
  const searchTerm = searchInput?.value.toLowerCase() || '';
  
  // Filter by search
  filteredPoems = userPoems.filter(poem => {
    const title = (poem.title || '').toLowerCase();
    const content = (poem.content || '').toLowerCase();
    const categories = poem.categories.join(' ').toLowerCase();
    
    return title.includes(searchTerm) || content.includes(searchTerm) || categories.includes(searchTerm);
  });
  
  // Sort
  const sortBy = sortSelect?.value || 'newest';
  
  filteredPoems.sort((a, b) => {
    switch(sortBy) {
      case 'newest':
        return b.timestamp - a.timestamp;
      case 'oldest':
        return a.timestamp - b.timestamp;
      case 'mostLiked':
        return (b.likes || 0) - (a.likes || 0);
      case 'mostCommented':
        return (b.commentCount || 0) - (a.commentCount || 0);
      case 'alphabetical':
        return (a.title || '').localeCompare(b.title || '');
      default:
        return 0;
    }
  });
  
  renderPoems();
}

// Render poems to grid
function renderPoems() {
  if (filteredPoems.length === 0) {
    poemsGrid.innerHTML = `<div class="no-poems">
      <p>${userPoems.length === 0 ? 'You haven\'t submitted any poems yet.' : 'No poems match your search.'}</p>
      <a href="submitpoems.html" class="btn">Submit Your First Poem</a>
    </div>`;
    return;
  }
  
  poemsGrid.innerHTML = filteredPoems.map(poem => createPoemCard(poem)).join('');
  
  // Initialize event listeners for each card
  filteredPoems.forEach(poem => {
    initializePoemCard(poem.id);
  });
}

// Create HTML for poem card
function createPoemCard(poem) {
  const dateStr = poem.timestamp.toLocaleDateString();
  const categories = poem.categories || [];
  
  return `
    <div class="poem-edit-card" data-poem-id="${poem.id}">
      <div class="poem-edit-header">
        <h3 title="${escapeHtml(poem.title || '')}">${escapeHtml(poem.title || 'Untitled')}</h3>
        <span class="poem-date-badge">${dateStr}</span>
      </div>
      
      <div class="poem-edit-body">
        <div class="form-group">
          <label>Title</label>
          <input type="text" class="poem-title-input" value="${escapeHtml(poem.title || '')}" placeholder="Poem title">
        </div>
        
        <div class="form-group">
          <label>Content</label>
          <textarea class="poem-content-input" placeholder="Write your poem...">${escapeHtml(poem.content || '')}</textarea>
        </div>
        
        <div class="form-group">
          <label>Categories</label>
          <div class="categories-container" id="categories-${poem.id}">
            ${categories.map(cat => `
              <span class="category-tag">
                ${escapeHtml(cat)}
                <span class="remove-cat" data-category="${escapeHtml(cat)}">×</span>
              </span>
            `).join('')}
          </div>
          <div class="add-category">
            <input type="text" class="new-category-input" placeholder="Add category" id="newCat-${poem.id}">
            <button class="add-cat-btn" data-poem-id="${poem.id}">Add</button>
          </div>
        </div>
        
        <div class="stats-preview">
          <div class="stat-item">
            <span class="stat-value">${poem.likes || 0}</span>
            <span class="stat-label">Likes</span>
          </div>
          <div class="stat-item">
            <span class="stat-value">${poem.commentCount || 0}</span>
            <span class="stat-label">Comments</span>
          </div>
          <div class="stat-item">
            <span class="stat-value">${(poem.views || 0)}</span>
            <span class="stat-label">Views</span>
          </div>
        </div>
        
        <div class="poem-actions">
          <button class="btn btn-success save-poem-btn" data-poem-id="${poem.id}">
            💾 Save Changes
          </button>
          <button class="btn btn-danger delete-poem-btn" data-poem-id="${poem.id}">
            🗑️ Delete
          </button>
        </div>
        
        <div class="save-status" id="status-${poem.id}"></div>
      </div>
    </div>
  `;
}

// Helper to escape HTML
function escapeHtml(unsafe) {
  if (!unsafe) return '';
  return unsafe
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

// Initialize event listeners for a poem card
function initializePoemCard(poemId) {
  const card = document.querySelector(`[data-poem-id="${poemId}"]`);
  if (!card) return;
  
  const saveBtn = card.querySelector('.save-poem-btn');
  const deleteBtn = card.querySelector('.delete-poem-btn');
  const addCatBtn = card.querySelector('.add-cat-btn');
  const newCatInput = card.querySelector('.new-category-input');
  const statusDiv = card.querySelector(`#status-${poemId}`);
  
  // Remove category handler
  card.querySelectorAll('.remove-cat').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const category = btn.dataset.category;
      await removeCategory(poemId, category, statusDiv);
    });
  });
  
  // Add category handler
  if (addCatBtn) {
    addCatBtn.addEventListener('click', async () => {
      const category = newCatInput.value.trim();
      if (category) {
        await addCategory(poemId, category, statusDiv);
        newCatInput.value = '';
      }
    });
  }
  
  // Manual save button only - NO AUTO-SAVE
  saveBtn?.addEventListener('click', async () => {
    await savePoemChanges(poemId, statusDiv);
  });
  
  // Delete button
  deleteBtn?.addEventListener('click', async () => {
    if (confirm('Are you sure you want to delete this poem? This action cannot be undone.')) {
      await deletePoem(poemId);
    }
  });
}

// Save poem changes - ONLY called when Save button is clicked
async function savePoemChanges(poemId, statusDiv) {
  if (!currentUser) return;
  
  const card = document.querySelector(`[data-poem-id="${poemId}"]`);
  if (!card) return;
  
  const title = card.querySelector('.poem-title-input')?.value.trim() || 'Untitled';
  const content = card.querySelector('.poem-content-input')?.value.trim() || '';
  
  // Validate
  if (!content) {
    showStatus(statusDiv, 'Poem content cannot be empty', 'error');
    return;
  }
  
  // Show saving status
  showStatus(statusDiv, 'Saving...');
  
  try {
    const poemRef = doc(db, 'recentPoems', poemId);
    await updateDoc(poemRef, {
      title,
      content,
      lastEdited: new Date()
    });
    
    // Update local data
    const poemIndex = userPoems.findIndex(p => p.id === poemId);
    if (poemIndex !== -1) {
      userPoems[poemIndex].title = title;
      userPoems[poemIndex].content = content;
    }
    
    showStatus(statusDiv, '✓ Saved!', 'saved');
    
    // Clear status after 2 seconds
    setTimeout(() => {
      if (statusDiv) statusDiv.innerHTML = '';
    }, 2000);
    
    showToast('Changes saved successfully!', 'success');
    
  } catch (err) {
    console.error('Error saving poem:', err);
    showStatus(statusDiv, '✗ Save failed', 'error');
    showToast('Failed to save changes: ' + err.message, 'error');
  }
}

// Add category
async function addCategory(poemId, category, statusDiv) {
  if (!currentUser) return;
  
  const poem = userPoems.find(p => p.id === poemId);
  if (!poem) return;
  
  const categories = [...(poem.categories || [])];
  if (categories.includes(category)) {
    showToast('Category already exists', 'warning');
    return;
  }
  
  categories.push(category);
  
  try {
    const poemRef = doc(db, 'recentPoems', poemId);
    await updateDoc(poemRef, { categories });
    
    // Update local
    poem.categories = categories;
    
    // Update UI
    const container = document.getElementById(`categories-${poemId}`);
    if (container) {
      container.innerHTML += `
        <span class="category-tag">
          ${escapeHtml(category)}
          <span class="remove-cat" data-category="${escapeHtml(category)}">×</span>
        </span>
      `;
      
      // Add remove listener to new tag
      container.lastElementChild.querySelector('.remove-cat').addEventListener('click', (e) => {
        e.stopPropagation();
        removeCategory(poemId, category, statusDiv);
      });
    }
    
    showToast('Category added', 'success');
    
  } catch (err) {
    console.error('Error adding category:', err);
    showToast('Failed to add category', 'error');
  }
}

// Remove category
async function removeCategory(poemId, category, statusDiv) {
  if (!currentUser) return;
  
  const poem = userPoems.find(p => p.id === poemId);
  if (!poem) return;
  
  const categories = (poem.categories || []).filter(c => c !== category);
  
  try {
    const poemRef = doc(db, 'recentPoems', poemId);
    await updateDoc(poemRef, { categories });
    
    // Update local
    poem.categories = categories;
    
    // Update UI
    const container = document.getElementById(`categories-${poemId}`);
    if (container) {
      const tags = container.querySelectorAll('.category-tag');
      tags.forEach(tag => {
        if (tag.textContent.includes(category)) {
          tag.remove();
        }
      });
    }
    
    showToast('Category removed', 'success');
    
  } catch (err) {
    console.error('Error removing category:', err);
    showToast('Failed to remove category', 'error');
  }
}

// Delete poem
async function deletePoem(poemId) {
  if (!currentUser) return;
  
  try {
    // Delete poem document
    await deleteDoc(doc(db, 'recentPoems', poemId));
    
    // Remove from local arrays
    userPoems = userPoems.filter(p => p.id !== poemId);
    filteredPoems = filteredPoems.filter(p => p.id !== poemId);
    
    // Re-render
    renderPoems();
    
    showToast('Poem deleted successfully', 'success');
    
  } catch (err) {
    console.error('Error deleting poem:', err);
    showToast('Failed to delete poem: ' + err.message, 'error');
  }
}

// Show status in poem card
function showStatus(element, message, type = '') {
  if (!element) return;
  element.textContent = message;
  element.className = `save-status ${type}`;
}

// Show toast notification
function showToast(message, type = 'success') {
  if (!toast) return;
  
  toast.textContent = message;
  toast.className = `toast ${type}`;
  toast.style.display = 'flex';
  
  setTimeout(() => {
    toast.style.display = 'none';
  }, 3000);
}

// Event listeners
searchInput?.addEventListener('input', applyFiltersAndSort);
sortSelect?.addEventListener('change', applyFiltersAndSort);

      signOut(auth);
      window.location.href = 'index.html';

<script>
// Dynamic login/signup link setup for current page redirect
(function() {
  function setupDynamicAuthLinks() {
    const currentPage = window.location.href;
    const currentFile = window.location.pathname.split('/').pop();
    let platform = 'poetry';
    if (currentFile.startsWith('store/')) platform = 'reads';
    if (currentFile === 'parent-house.html') platform = 'foundry';
    
    const loginParams = new URLSearchParams();
    loginParams.append('platform', platform);
    loginParams.append('redirect', currentPage);
    
    document.querySelectorAll('a[href*="universal-login.html"]').forEach(link => {
      link.href = `universal-login.html?${loginParams.toString()}`;
    });
    
    document.querySelectorAll('a[href*="universal-signup.html"]').forEach(link => {
      link.href = `universal-signup.html?${loginParams.toString()}`;
    });
  }
  
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', setupDynamicAuthLinks);
  } else {
    setupDynamicAuthLinks();
  }
})();
</script>
