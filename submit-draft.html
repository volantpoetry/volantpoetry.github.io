<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Submit Poem Draft | Volant Poetry</title>
<script>
    // Simple console blocker - production only
    (function() {
        if (window.location.hostname.includes('localhost') || 
            window.location.hostname.includes('127.0.0.1')) {
            return; // Allow in development
        }
        
        // Block all console methods
        var methods = ['log', 'info', 'warn', 'error', 'debug', 'trace', 'table', 'group', 'groupEnd', 'dir'];
        methods.forEach(function(m) {
            console[m] = function() {};
            try {
                Object.defineProperty(console, m, { configurable: false, writable: false });
            } catch(e) {}
        });
        
        window.onerror = function() { return true; };
        window.onunhandledrejection = function() { return true; };
    })();
</script>

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Submit Poem Draft | Volant Poetry">
<meta name="twitter:description" content="Save your poem as a draft on Volant Poetry. Write, edit, and publish your poetry later.">
<meta name="twitter:image" content="https://volantpoetry.vercel.app/images/logo.png">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Favicons -->
<link rel="icon" type="image/png" href="images/volant-favicon.png">
<link rel="apple-touch-icon" href="images/volant-favicon.png">

<style>
:root {
  --primary: #4b2aad;
  --primary-light: #6f4ae4;
  --text: #1a1a1a;
  --muted: #6b6b6b;
  --radius: 14px;
  --bg-light: #faf9fe;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 50%, #a18cd1 100%);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
  padding: 0;
}

/* ===== HEADER WITH LOGO ONLY ===== */
.header-bar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 2000;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 24px;
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(75, 42, 173, 0.1);
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
}

.logo {
  font-family: 'Playfair Display', serif;
  font-size: 1.6rem;
  font-weight: 700;
  color: #4b2aad;
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 4px;
}

.logo-text {
  font-family: 'Playfair Display', serif;
  font-size: 1.6rem;
  font-weight: 700;
  color: #4b2aad;
  cursor: default;
  user-select: none;
}

.nav-logo-img {
  height: 36px;
  width: auto;
  object-fit: contain;
  cursor: default;
}

.logo .highlight {
  color: #ffffff;
  text-shadow: 0 0 2px #4b2aad, 0 0 4px #4b2aad, 0 0 6px #4b2aad;
}

/* Empty spacer to keep logo left-aligned */
.header-spacer {
  width: 0;
}

/* ===== FLOATING ELEMENTS ===== */
.floating {
  position: fixed;
  font-size: 2rem;
  color: rgba(255,255,255,0.5);
  animation: float 12s linear infinite alternate;
  user-select: none;
  pointer-events: none;
  z-index: 0;
}
@keyframes float {
  0% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-25px) rotate(10deg); }
  100% { transform: translateY(0) rotate(-10deg); }
}

/* ===== CONTAINER / CARD ===== */
.container {
  max-width: 700px;
  margin: 90px auto 50px auto;
  padding: 35px 40px;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(10px);
  border-radius: var(--radius);
  box-shadow: 0 8px 40px rgba(0,0,0,0.08);
  border: 1px solid rgba(255,255,255,0.3);
  position: relative;
  z-index: 1;
}

.container h1 {
  text-align: center;
  margin-bottom: 30px;
  font-family: 'Playfair Display', serif;
  font-weight: 700;
  color: #4b2aad;
  font-size: 2rem;
}

/* ===== FORM FIELDS ===== */
.field-container {
  margin-bottom: 22px;
}

.field-container label {
  display: block;
  font-weight: 600;
  margin-bottom: 6px;
  color: #2d2a24;
  font-size: 0.9rem;
}

.field-container input,
.field-container textarea {
  width: 100%;
  padding: 14px 16px;
  border: 2px solid #e8e4f0;
  border-radius: var(--radius);
  font-size: 1rem;
  font-family: inherit;
  background: rgba(255,255,255,0.95);
  transition: all 0.25s ease;
  color: #1a1a1a;
}

.field-container input:focus,
.field-container textarea:focus {
  outline: none;
  border-color: #4b2aad;
  box-shadow: 0 0 0 4px rgba(75, 42, 173, 0.1);
}

.field-container textarea {
  resize: vertical;
  min-height: 120px;
}

.field-container small {
  display: block;
  margin-top: 4px;
  color: var(--muted);
  font-size: 0.8rem;
}

/* ===== READ-ONLY AUTHOR FIELD ===== */
.field-container input[readonly] {
  background: #f5f0ff;
  color: #4b2aad;
  font-weight: 600;
  cursor: default;
  border-color: #d8d0e8;
}

.field-container input[readonly]:focus {
  box-shadow: none;
  border-color: #d8d0e8;
}

/* ===== SUBMIT BUTTON ===== */
.submit-btn {
  background: linear-gradient(135deg, #4b2aad, #6f4ae4);
  color: #fff;
  padding: 14px 28px;
  border: none;
  border-radius: var(--radius);
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  width: 100%;
  font-family: 'Inter', sans-serif;
}

.submit-btn:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(75, 42, 173, 0.3);
}

.submit-btn:active:not(:disabled) {
  transform: translateY(0);
}

.submit-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none !important;
}

.success-message {
  margin-top: 15px;
  font-weight: 600;
  text-align: center;
  padding: 10px;
  border-radius: var(--radius);
}

.success-message.success {
  color: #15723d;
  background: #dff7e5;
}

.success-message.error {
  color: #b33;
  background: #fde8e8;
}

/* ===== SUBMIT ANOTHER BUTTON ===== */
.submit-another-container {
  display: none;
  margin-top: 15px;
}

.submit-another-container.show {
  display: block;
}

.submit-another-btn {
  background: #4b2aad;
  color: #fff;
  padding: 12px 24px;
  border: none;
  border-radius: var(--radius);
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  width: 100%;
  font-family: 'Inter', sans-serif;
}

.submit-another-btn:hover {
  background: #6f4ae4;
  transform: translateY(-2px);
}

/* ===== BACK BUTTON IN FORM ===== */
.form-footer {
  display: flex;
  gap: 12px;
  margin-top: 10px;
}

.back-btn-form {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 14px 24px;
  border-radius: var(--radius);
  background: #f0ece6;
  color: #2d2a24;
  text-decoration: none;
  font-weight: 500;
  font-size: 0.95rem;
  transition: all 0.25s ease;
  border: 1px solid #e0d8d0;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  flex: 0 0 auto;
}

.back-btn-form:hover {
  background: #4b2aad;
  color: #ffffff;
  border-color: #4b2aad;
  transform: translateX(-2px);
  box-shadow: 0 4px 12px rgba(75, 42, 173, 0.25);
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .header-bar {
    padding: 10px 16px;
  }
  
  .logo-text {
    font-size: 1.2rem;
  }
  
  .nav-logo-img {
    height: 28px;
  }
  
  .container {
    margin: 80px 12px 30px 12px;
    padding: 24px 20px;
    border-radius: 16px;
  }
  
  .container h1 {
    font-size: 1.6rem;
  }
  
  .form-footer {
    flex-direction: column;
  }
  
  .back-btn-form {
    justify-content: center;
    width: 100%;
  }
}

@media (max-width: 480px) {
  .header-bar {
    padding: 8px 12px;
  }
  
  .logo-text {
    font-size: 1rem;
  }
  
  .nav-logo-img {
    height: 22px;
  }
  
  .container {
    margin: 74px 8px 20px 8px;
    padding: 18px 14px;
    border-radius: 14px;
  }
  
  .container h1 {
    font-size: 1.3rem;
    margin-bottom: 20px;
  }
  
  .field-container {
    margin-bottom: 16px;
  }
  
  .field-container input,
  .field-container textarea {
    padding: 12px 14px;
    font-size: 0.95rem;
    border-radius: 12px;
  }
}
</style>
</head>
<body>

<!-- ===== HEADER WITH LOGO ONLY (Home hidden) ===== -->
<header class="header-bar">
  <div class="logo">
    <img src="images/logokk.png" alt="Volant Poetry Logo" class="nav-logo-img">
    <span class="logo-text">
      <span class="highlight">Volant</span> Poetry
    </span>
  </div>
  <!-- Home button removed -->
  <div class="header-spacer"></div>
</header>

<!-- Floating emojis -->
<div class="floating" style="top: 12%; left: 4%;">✒️</div>
<div class="floating" style="top: 22%; right: 6%;">📜</div>
<div class="floating" style="top: 72%; left: 8%;">⭐</div>
<div class="floating" style="top: 55%; left: 50%;">🖋️</div>
<div class="floating" style="top: 85%; right: 10%;">🌙</div>

<!-- ===== MAIN FORM CARD ===== -->
<div class="container">
  <h1>Save Poem Draft</h1>
  
  <form id="draftPoemForm">
    <div class="field-container">
      <label for="title">Title</label>
      <input type="text" id="title" placeholder="Your poem title" required>
    </div>
    
    <div class="field-container">
      <label for="content">Full Content</label>
      <textarea id="content" rows="6" placeholder="Write your poem..." required></textarea>
    </div>
    
    <div class="field-container">
      <label for="categories">Categories (comma-separated)</label>
      <input type="text" id="categories" placeholder="Love, Life, Nature..." required>
    </div>
    
    <div class="field-container">
      <label for="author">Author</label>
      <input type="text" id="author" placeholder="Your name or pen name" readonly>
    </div>

    <div class="form-footer">
      <button type="submit" class="submit-btn" id="submitBtn">Save as Draft</button>
      <a href="user-profile.html" id="backBtnForm" class="back-btn-form">Back</a>
    </div>
    
    <p class="success-message" id="successMessage"></p>
    
    <div class="submit-another-container" id="submitAnotherContainer">
      <button class="submit-another-btn" id="submitAnotherBtn"> Save Another Draft</button>
    </div>
  </form>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { 
  getAuth, 
  onAuthStateChanged 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { 
  getFirestore, 
  collection, 
  addDoc, 
  serverTimestamp, 
  doc, 
  getDoc 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC4DHI8aBVY4JjTvJ-r-TGIDPsewtEWxzU",
  authDomain: "silent-depth.firebaseapp.com",
  projectId: "silent-depth",
  storageBucket: "silent-depth.appspot.com",
  messagingSenderId: "78008755450",
  appId: "1:78008755450:web:3fd0f0f298a08820935543"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUsername = "Anonymous";
let isSubmitted = false;

/* ---------------- ELEMENTS ---------------- */
const form = document.getElementById("draftPoemForm");
const submitBtn = document.getElementById("submitBtn");
const successMessage = document.getElementById("successMessage");
const submitAnotherContainer = document.getElementById("submitAnotherContainer");
const submitAnotherBtn = document.getElementById("submitAnotherBtn");
const authorInput = document.getElementById("author");

/* ===== RESET FORM FOR NEW SUBMISSION ===== */
function resetFormForNewSubmission() {
  isSubmitted = false;
  submitBtn.disabled = false;
  submitBtn.textContent = "Save as Draft";
  submitAnotherContainer.classList.remove('show');
  successMessage.className = "success-message";
  successMessage.textContent = "";
  
  form.querySelectorAll('input, textarea').forEach(el => {
    el.disabled = false;
  });
  
  form.reset();
  authorInput.value = currentUsername;
}

/* ===== SUBMIT ANOTHER BUTTON ===== */
submitAnotherBtn.addEventListener('click', () => {
  resetFormForNewSubmission();
});

/* ---------------- AUTH ---------------- */
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    alert("Please log in to save a draft!");
    window.location.href = `universal-login.html?platform=poetry&redirect=${encodeURIComponent(window.location.href)}`;
    return;
  }

  try {
    const userDoc = await getDoc(doc(db, "users", user.uid));
    if (userDoc.exists()) {
      currentUsername = userDoc.data().username || "Anonymous";
    } else if (user.displayName) {
      currentUsername = user.displayName;
    } else {
      currentUsername = user.email.split("@")[0];
    }

    authorInput.value = currentUsername;

  } catch (err) {
    console.error("Error fetching username:", err);
  }
});

/* ---------------- SAVE DRAFT ---------------- */
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  
  // Prevent double submission
  if (isSubmitted) return;
  
  // Lock the form
  isSubmitted = true;
  submitBtn.disabled = true;
  submitBtn.textContent = "Saving...";
  
  // Disable all form inputs
  form.querySelectorAll('input, textarea').forEach(el => {
    el.disabled = true;
  });

  const title = document.getElementById("title").value.trim();
  const content = document.getElementById("content").value.trim();
  const categoriesInput = document.getElementById("categories").value.trim();
  const author = authorInput.value.trim() || currentUsername;

  if (!categoriesInput) {
    alert("Please provide at least one category.");
    isSubmitted = false;
    submitBtn.disabled = false;
    submitBtn.textContent = "Save as Draft";
    form.querySelectorAll('input, textarea').forEach(el => {
      el.disabled = false;
    });
    return;
  }

  const categories = categoriesInput
    .split(",")
    .map(c => c.trim())
    .filter(c => c);

  try {
    await addDoc(collection(db, "draftPoems"), {
      title,
      content,
      author,
      authorId: auth.currentUser.uid,
      categories,
      timestamp: serverTimestamp(),
      submittedBy: currentUsername,
      status: "draft"
    });

    successMessage.className = "success-message success";
    successMessage.textContent = "📝 Poem saved as draft successfully!";
    
    // Show Submit Another button
    submitAnotherContainer.classList.add('show');
    submitBtn.textContent = "✅ Saved";

  } catch (err) {
    successMessage.className = "success-message error";
    successMessage.textContent = "❌ Error: " + err.message;
    
    // Unlock on error
    isSubmitted = false;
    submitBtn.disabled = false;
    submitBtn.textContent = "Save as Draft";
    form.querySelectorAll('input, textarea').forEach(el => {
      el.disabled = false;
    });
  }
});
</script>

<script>
// Dynamic login/signup link setup for current page redirect
(function() {
  function setupDynamicAuthLinks() {
    const currentPage = window.location.href;
    const currentFile = window.location.pathname.split('/').pop();
    let platform = 'poetry';
    if (currentFile.startsWith('store/')) platform = 'reads';
    if (currentFile === 'parent-house.html') platform = 'foundry';
    
    const loginParams = new URLSearchParams();
    loginParams.append('platform', platform);
    loginParams.append('redirect', currentPage);
    
    document.querySelectorAll('a[href*="universal-login.html"]').forEach(link => {
      link.href = `universal-login.html?${loginParams.toString()}`;
    });
    
    document.querySelectorAll('a[href*="universal-signup.html"]').forEach(link => {
      link.href = `universal-signup.html?${loginParams.toString()}`;
    });
  }
  
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', setupDynamicAuthLinks);
  } else {
    setupDynamicAuthLinks();
  }
})();
</script>
<script src="return-url-handler.js"></script>
</body>
</html>
