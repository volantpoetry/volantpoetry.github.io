name: Generate Sitemap

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '**/*.html'
      - '**/*.js'
      - 'generate-sitemap.js'

jobs:
  generate-sitemap:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: 📦 Install dependencies
        run: npm install glob
        
      - name: 🗺️ Generate sitemap
        run: node generate-sitemap.js
        
      - name: ✅ Verify sitemap
        run: |
          if [ ! -f sitemap.xml ]; then
            echo "❌ sitemap.xml not generated!"
            exit 1
          fi
          URL_COUNT=$(grep -c "<loc>" sitemap.xml || echo "0")
          echo "✅ sitemap.xml generated successfully"
          echo "📊 Total URLs in sitemap: $URL_COUNT"
          echo ""
          echo "📄 First 15 lines:"
          head -15 sitemap.xml
          
      - name: 📤 Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add sitemap.xml robots.txt
          git diff --staged --quiet || git commit -m "🤖 Auto-update sitemap and robots.txt [skip ci]"
          git push
