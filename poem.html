<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poem | Volant Poetry</title>
<!-- Favicons -->
<link rel="icon" type="image/png" href="images/volant-favicon.png">
<link rel="apple-touch-icon" href="images/volant-favicon.png">

<!-- Google Fonts: Garamond (EB Garamond) -->
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">

<style>
body { margin:0; font-family:'Inter',sans-serif; background: linear-gradient(135deg,#fdf6f0,#e2e9f0,#f7f0e5,#e8e0d8); background-size:400% 400%; animation:gradientShift 15s ease infinite; color:#4b3f2f; }
@keyframes gradientShift { 0% { background-position:0% 50%; } 50% { background-position:100% 50%; } 100% { background-position:0% 50%; } }
.poem-section { display:flex; justify-content:center; padding:40px 20px; }
.poem-card {   background: linear-gradient(160deg, #fdf6f0, #e2e9f0); max-width:700px; width:100%; padding:25px 22px; border-radius:14px; box-shadow:0 8px 20px rgba(0,0,0,0.08); display:flex; flex-direction:column; gap:12px; position:relative; }

.author-line { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.author-line img { width:50px; height:50px; border-radius:50%; object-fit:cover; }
.author-line a { font-weight:700; color:#B8860B; text-decoration:none; }

/* ===== GARAMOND FONT FOR POEM TITLE ===== */
#poem-title {
  font-family: 'EB Garamond', 'Georgia', serif;
  color: #4b2aad;
  font-size: 1.8rem;
  font-weight: 700;
  margin-bottom: 6px;
  letter-spacing: 0.5px;
}

/* ===== GARAMOND FONT FOR POEM CONTENT ===== */
.poem-content {
  white-space: pre-line;
  margin-bottom: 10px;
  font-family: 'EB Garamond', 'Georgia', serif;
  font-size: 1.2rem;
  color: #3d352a;
  line-height: 1.5;
  padding-left: 10px;
  font-weight: 400;
  letter-spacing: 0.3px;
}

.interactive-section { display:none; flex-direction:column; gap:6px; }
.poem-actions { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:6px; }
.comment-section { flex:1; display:flex; gap:6px; }
.comment-input { flex:1; border-radius:8px; border:1px solid #ccc; padding:6px 10px; font-family:'Inter',sans-serif; }
.comment-btn, .like-btn { border:none; border-radius:8px; padding:6px 12px; background:#4b3f2f; color:#fff; cursor:pointer; font-family:'Inter',sans-serif; }
.like-btn.liked { background:#e63946; }
/* Comment list styles - external container that toggles */
.comments-outer-wrapper {
  max-width:700px;
  margin:0 auto;
  padding:0 20px 40px 20px;
  display: none; /* hidden by default, toggled by 💬 click */
}
.comment-list-external {
  display:flex;
  flex-direction:column;
  gap:6px;
  margin-top:12px;
}
.comment { background:#f4ede7; border-radius:8px; padding:8px; }
.home-link { position:absolute; top:20px; right:20px; font-weight:600; color:#e63946; text-decoration:none; font-size:1rem; transition:color 0.3s; z-index:1000; font-family:'Inter',sans-serif; }
.home-link:hover { color:#e63946; }

/* 🔽 Small screens only */
@media (max-width: 768px) {
  .home-link {
    top: 12px;
    right: 12px;
    font-size: 0.85rem;
  }
  .comments-outer-wrapper {
    padding:0 16px 40px 16px;
  }
  #poem-title {
    font-size: 1.4rem;
  }
  .poem-content {
    font-size: 1.1rem;
    line-height: 1.4;
  }
}
.message-count {
  cursor: pointer;
}

/* ===== WELCOME BANNER ===== */
.welcome-banner {
  display: none;
  background: linear-gradient(135deg, #d4edda, #b7dfc9);
  border-radius: 12px;
  padding: 12px 18px;
  margin-bottom: 12px;
  border-left: 4px solid #2d7d46;
  color: #155724;
  font-weight: 500;
  font-size: 0.95rem;
  animation: slideDown 0.5s ease;
}
.welcome-banner.show {
  display: flex;
  align-items: center;
  gap: 10px;
}
.welcome-banner i {
  font-size: 1.2rem;
  color: #2d7d46;
}
@keyframes slideDown {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== SIGNED-IN STATE ===== */
.comment-section .comment-input:focus {
  border-color: #4b2aad;
  box-shadow: 0 0 0 3px rgba(75, 42, 173, 0.1);
}
.comment-section .comment-input.signed-in {
  border-color: #4b2aad;
  background: #faf8ff;
}
</style>
</head>
<body>

<section class="poem-section">
  <div class="poem-card">
    <!-- Author Image + Name -->
    <div class="author-line">
      <img id="author-img" src="/images/default-avatar.png" alt="Author">
      <a id="author-link" href="#"></a>
    </div>

    <h2 id="poem-title"></h2>
    <p id="poem-content" class="poem-content"></p>

    <div class="interactive-section">
      <!-- ===== WELCOME BANNER ===== -->
      <div class="welcome-banner" id="welcomeBanner">
        <i class="fas fa-check-circle"></i>
        <span id="welcomeMessage">You're signed in! ✨ Now you can like, comment, and reply.</span>
      </div>

      <div class="poem-actions">
        <div class="comment-section">
          <input class="comment-input" id="commentInput" placeholder="Write a comment...">
          <button class="comment-btn" id="commentBtn">Post</button>
        </div>
        <button class="like-btn">❤️</button>
        <span class="like-count">0</span>
        <span class="message-count" id="messageCountTrigger">💬</span>
      </div>
    </div>
  </div>
</section>

<!-- Comment list moved OUTSIDE the poem card, positioned below it - toggles via 💬 -->
<div class="comments-outer-wrapper" id="commentsOuterWrapper">
  <div class="comment-list-external" id="externalCommentList"></div>
</div>

<a href="index.html" class="home-link">Discover More at Volant Poetry</a>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, doc, addDoc, getDoc, updateDoc, increment, arrayUnion, arrayRemove, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = { apiKey:"AIzaSyC4DHI8aBVY4JjTvJ-r-TGIDPsewtEWxzU", authDomain:"silent-depth.firebaseapp.com", projectId:"silent-depth", storageBucket:"silent-depth.appspot.com", messagingSenderId:"78008755450", appId:"1:78008755450:web:3fd0f0f298a08820935543" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const params = new URLSearchParams(window.location.search);
const slug = params.get("slug");
const collectionName = params.get("collection") || "recentPoems";

let currentUser = null;
let currentPoemId = null;
let commentsLoadedForPoem = false;
let isFirstLoad = true;

// ===== SAVED COMMENT KEY =====
const SAVED_COMMENT_KEY = 'volant_saved_comment';

const titleEl = document.getElementById("poem-title");
const contentEl = document.getElementById("poem-content");
const authorImgEl = document.getElementById("author-img");
const authorLinkEl = document.getElementById("author-link");
const poemCard = document.querySelector(".poem-card");
const interactiveSection = poemCard.querySelector(".interactive-section");
const commentsOuterWrapper = document.getElementById("commentsOuterWrapper");
const externalCommentList = document.getElementById("externalCommentList");
const messageCountTrigger = document.getElementById("messageCountTrigger");
const welcomeBanner = document.getElementById("welcomeBanner");
const welcomeMessage = document.getElementById("welcomeMessage");
const commentInput = document.getElementById("commentInput");
const commentBtn = document.getElementById("commentBtn");

// Helper function to redirect to login page with return URL
function redirectToLogin(saveComment = false) {
  const currentUrl = encodeURIComponent(window.location.href);
  const loginUrl = `universal-login.html?platform=poetry&redirect=${currentUrl}`;
  
  // If there's a comment, save it to localStorage first
  if (saveComment) {
    const comment = commentInput.value.trim();
    if (comment) {
      localStorage.setItem(SAVED_COMMENT_KEY, comment);
      console.log('💾 Comment saved to localStorage:', comment);
    }
  }
  
  window.location.href = loginUrl;
}

// Custom alert that redirects on OK
function showLoginAlertAndRedirect(message) {
  if (confirm(message + "\n\nClick OK to sign in. Your comment will be saved.")) {
    redirectToLogin(true);
  }
}

// Check if user just signed in
function checkJustSignedIn() {
  const urlParams = new URLSearchParams(window.location.search);
  const justSignedIn = urlParams.get('signedIn') === 'true' || 
                        sessionStorage.getItem('justSignedIn') === 'true';
  if (justSignedIn) {
    sessionStorage.removeItem('justSignedIn');
    if (urlParams.has('signedIn')) {
      urlParams.delete('signedIn');
      const newUrl = window.location.pathname + '?' + urlParams.toString() + window.location.hash;
      window.history.replaceState({}, '', newUrl);
    }
    return true;
  }
  return false;
}

// Check for saved comment from localStorage (silently restore)
function checkSavedComment() {
  const savedComment = localStorage.getItem(SAVED_COMMENT_KEY);
  if (savedComment) {
    commentInput.value = savedComment;
    return true;
  }
  return false;
}

// Clear saved comment after posting
function clearSavedComment() {
  localStorage.removeItem(SAVED_COMMENT_KEY);
  commentInput.value = '';
}

onAuthStateChanged(auth, user => { 
  const previousUser = currentUser;
  currentUser = user; 
  
  const justSignedIn = (previousUser === null && user !== null) || checkJustSignedIn();
  
  if(slug) loadPoem(slug, justSignedIn); 
});

function slugify(text){ return text.toLowerCase().replace(/\s+/g,"-"); }

// Helper: render comments
async function renderCommentsExternal(poemDocId, preserveVisibility = false) {
  if (!poemDocId) return;
  
  try {
    const commentsSnapshot = await getDocs(collection(db, "recentPoems", poemDocId, "comments"));
    const commentCount = commentsSnapshot.size;
    const messageCountSpan = poemCard.querySelector(".message-count");
    if (messageCountSpan) messageCountSpan.textContent = `💬 ${commentCount}`;
    
    if (commentsSnapshot.empty) {
      externalCommentList.innerHTML = "<p style='color:#888; text-align:center; padding:20px;'>No comments yet. Be the first to share your thoughts ✨</p>";
      return;
    }
    
    const comments = commentsSnapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    comments.sort((a,b) => { const ta = a.timestamp?.toMillis?.() || 0; const tb = b.timestamp?.toMillis?.() || 0; return ta - tb; });
    
    externalCommentList.innerHTML = "";
    
    for (const c of comments) {
      let displayName = c.username || "Anonymous";
      let userLink = c.userId ? `/user-profile.html?uid=${c.userId}` : "#";
      const div = document.createElement("div");
      div.className = "comment";
      div.dataset.commentId = c.id;
      div.style.cssText = "background:#fff; padding:8px 12px; margin:6px 0; border-radius:6px;";
      div.innerHTML = `<a href="${userLink}" style="font-weight:600;color:#a67c52;text-decoration:none;margin-right:6px;">${escapeHtml(displayName)}</a>: ${escapeHtml(c.text)}
        <div class="comment-actions" style="margin-top:4px;"><small class="reply-toggle" style="color:#5a3cb3; cursor:pointer;">Reply</small></div>
        <div class="reply-section" style="margin-left:20px;margin-top:6px;"></div>`;
      externalCommentList.appendChild(div);
      
      const repliesCol = collection(db, "recentPoems", poemDocId, "comments", c.id, "replies");
      const repliesSnap = await getDocs(repliesCol);
      if (!repliesSnap.empty) {
        const replySection = div.querySelector(".reply-section");
        repliesSnap.forEach(r => {
          const reply = r.data();
          replySection.innerHTML += `<div style="background:#f7f7f7; padding:6px 10px; border-radius:6px; margin:4px 0;">
            <a href="/user-profile.html?uid=${reply.userId}" style="font-weight:600; color:#5a3cb3; text-decoration:none;">${escapeHtml(reply.username)}</a>: ${escapeHtml(reply.text)}</div>`;
        });
      }
    }
    
    document.querySelectorAll('.reply-toggle').forEach(toggle => {
      toggle.removeEventListener('click', handleReplyClick);
      toggle.addEventListener('click', handleReplyClick);
    });
    
    commentsLoadedForPoem = true;
    
  } catch(err) {
    console.error(err);
    externalCommentList.innerHTML = "<p style='color:red;'>Failed to load comments.</p>";
  }
}

// Handle reply to a comment
async function handleReplyClick(e) {
  const target = e.currentTarget;
  const commentDiv = target.closest(".comment");
  if (!commentDiv) return;
  const commentId = commentDiv.dataset.commentId;
  if (!commentId || !currentPoemId) return;
  if (!currentUser) {
    showLoginAlertAndRedirect("Please sign in to reply!");
    return;
  }
  
  const replyText = prompt("Write your reply:");
  if (!replyText || !replyText.trim()) return;
  
  try {
    const userDoc = await getDoc(doc(db, "users", currentUser.uid));
    const username = userDoc.exists() ? (userDoc.data().username || currentUser.email) : "Anonymous";
    
    await addDoc(collection(db, "recentPoems", currentPoemId, "comments", commentId, "replies"), {
      userId: currentUser.uid,
      username: username,
      text: replyText.trim(),
      timestamp: new Date()
    });
    
    const wasVisible = commentsOuterWrapper.style.display === "block";
    await renderCommentsExternal(currentPoemId);
    if (wasVisible) {
      commentsOuterWrapper.style.display = "block";
    } else {
      commentsOuterWrapper.style.display = "none";
    }
  } catch(err) {
    console.error(err);
    alert("Failed to post reply.");
  }
}

function escapeHtml(str) {
  if (!str) return "";
  return str.replace(/[&<>]/g, function(m) {
    if (m === "&") return "&amp;";
    if (m === "<") return "&lt;";
    if (m === ">") return "&gt;";
    return m;
  });
}

async function loadPoem(slug, justSignedIn = false){
  const snapshot = await getDocs(collection(db, collectionName));
  for(const snap of snapshot.docs){
    const data = snap.data();
    const compare = data.slug || slugify(data.title);
    if(compare===slug){
      titleEl.textContent = data.title;
      contentEl.innerHTML = data.content.replace(/\n/g,"<br>");

      const poetUid = data.authorId || "";
      let displayName = data.author || "Anonymous";
      let profileLink = "#";
      let profileImage = "/images/default-avatar.png";
      if(poetUid){
        try{
          const userDoc = await getDoc(doc(db,"users",poetUid));
          if(userDoc.exists()){
            const userData = userDoc.data();
            displayName = userData.username || displayName;
            profileLink = `/user-profile.html?uid=${encodeURIComponent(poetUid)}`;
            profileImage = userData.photoURL || userData.cachedAvatarURL || profileImage;
          }
        }catch(err){ console.warn(err); }
      }
      authorImgEl.src = profileImage;
      authorLinkEl.href = profileLink;
      authorLinkEl.textContent = displayName;

      if(collectionName==="recentPoems" && !data.isFeatured){
        interactiveSection.style.display="flex";
        poemCard.dataset.id = snap.id;
        currentPoemId = snap.id;
        
        commentsOuterWrapper.style.display = "none";
        commentsLoadedForPoem = false;
        
        const likeBtn = poemCard.querySelector(".like-btn");
        const likeCount = poemCard.querySelector(".like-count");
        likeCount.textContent = data.likes||0;
        if(currentUser && data.likedBy?.includes(currentUser.uid)) likeBtn.classList.add("liked");
        
        if (currentUser) {
          commentInput.classList.add('signed-in');
          commentInput.placeholder = 'Write a comment...';
          commentBtn.textContent = 'Post';
          commentBtn.style.background = '#4b2aad';
        } else {
          commentInput.classList.remove('signed-in');
          commentInput.placeholder = 'Sign in to comment...';
          commentBtn.textContent = 'Post';
          commentBtn.style.background = '#4b3f2f';
        }
        
        await renderCommentsExternal(snap.id);
        commentsOuterWrapper.style.display = "none";
        
        // ===== SILENTLY CHECK FOR SAVED COMMENT =====
        const hasSavedComment = checkSavedComment();
        
        if (justSignedIn && currentUser) {
          // User just signed in - show welcome
          welcomeBanner.classList.add('show');
          const userName = currentUser.displayName || currentUser.email?.split('@')[0] || 'Reader';
          
          if (hasSavedComment) {
            welcomeMessage.textContent = `Welcome back, ${userName}! ✨ Your comment is ready to post.`;
            // Auto-open comments (no visible notice)
            setTimeout(() => {
              commentsOuterWrapper.style.display = "block";
              commentInput.focus();
              commentInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 500);
          } else {
            welcomeMessage.textContent = `Welcome back, ${userName}! ✨ You can now like, comment, and reply.`;
          }
          
          setTimeout(() => {
            welcomeBanner.classList.remove('show');
          }, 5000);
          
        } else if (currentUser && isFirstLoad) {
          // User already signed in
          welcomeBanner.classList.add('show');
          const userName = currentUser.displayName || currentUser.email?.split('@')[0] || 'Reader';
          welcomeMessage.textContent = `Welcome, ${userName}! 💫 Share your thoughts below.`;
          setTimeout(() => {
            welcomeBanner.classList.remove('show');
          }, 3000);
          isFirstLoad = false;
        }
        
      } else {
        interactiveSection.style.display = "none";
        commentsOuterWrapper.style.display = "none";
      }
      return;
    }
  }
  titleEl.textContent="Poem not found"; contentEl.textContent=""; authorImgEl.src="/images/default-avatar.png"; authorLinkEl.href="#"; authorLinkEl.textContent="";
  interactiveSection.style.display = "none";
  commentsOuterWrapper.style.display = "none";
}

// --- Toggle comment section ---
function toggleCommentSection() {
  if (!currentPoemId) return;
  
  if (commentsOuterWrapper.style.display === "none" || commentsOuterWrapper.style.display === "") {
    if (!commentsLoadedForPoem && currentPoemId) {
      renderCommentsExternal(currentPoemId).then(() => {
        commentsOuterWrapper.style.display = "block";
        setTimeout(() => {
          commentsOuterWrapper.scrollIntoView({ behavior: "smooth", block: "start" });
          if (currentUser) commentInput.focus();
        }, 100);
      });
    } else {
      commentsOuterWrapper.style.display = "block";
      setTimeout(() => {
        commentsOuterWrapper.scrollIntoView({ behavior: "smooth", block: "start" });
        if (currentUser) commentInput.focus();
      }, 100);
    }
  } else {
    commentsOuterWrapper.style.display = "none";
  }
}

// --- Like / Comment Handler ---
document.addEventListener("click", async e=>{
  const user = auth.currentUser;

  if(e.target.classList.contains("like-btn")){
    if(!user){ 
      showLoginAlertAndRedirect("Please sign in to like poems!");
      return; 
    }
    const card = e.target.closest(".poem-card");
    const docId = card.dataset.id;
    const countSpan = card.querySelector(".like-count");
    const likeBtn = e.target;
    const poemRef = doc(db,"recentPoems",docId);

    try{
        const docSnap = await getDoc(poemRef);
        if(!docSnap.exists()) return;
        const data = docSnap.data();
        const likedBy = Array.isArray(data.likedBy) ? data.likedBy : [];
        let likes = data.likes || 0;

        if(likedBy.includes(user.uid)){
            const newLikes = Math.max(likes - 1, 0);
            await updateDoc(poemRef,{
                likes: newLikes,
                likedBy: likedBy.filter(uid => uid !== user.uid)
            });
            likeBtn.classList.remove("liked");
            countSpan.textContent = newLikes;
        } else {
            const newLikes = likes + 1;
            await updateDoc(poemRef,{
                likes: newLikes,
                likedBy: arrayUnion(user.uid)
            });
            likeBtn.classList.add("liked");
            countSpan.textContent = newLikes;
        }

    }catch(err){ console.error(err); }
  }

  if(e.target.classList.contains("message-count") || e.target.id === "messageCountTrigger" || e.target.closest(".message-count")){
    toggleCommentSection();
    return;
  }

  // ===== POST COMMENT =====
  if(e.target.classList.contains("comment-btn") || e.target.id === "commentBtn"){
    if(!user){ 
      // Save comment to localStorage before redirecting
      const comment = commentInput.value.trim();
      if (comment) {
        localStorage.setItem(SAVED_COMMENT_KEY, comment);
        showLoginAlertAndRedirect("Please sign in to post your comment.");
      } else {
        showLoginAlertAndRedirect("Please sign in to comment!");
      }
      return; 
    }
    
    const card = e.target.closest(".poem-card");
    const docId = card.dataset.id;
    const input = document.getElementById("commentInput");
    const text = input.value.trim();
    if(!text) return;
    
    if(!currentPoemId && docId) currentPoemId = docId;

    try{
      const userDoc = await getDoc(doc(db,"users",user.uid));
      const username = userDoc.exists() ? (userDoc.data().username || user.email) : "Anonymous";

      await addDoc(collection(db,"recentPoems",docId,"comments"),{ 
        userId: user.uid, 
        username, 
        text, 
        timestamp: new Date() 
      });

      // Clear input and remove saved comment
      clearSavedComment();
      
      const wasVisible = (commentsOuterWrapper.style.display === "block");
      await renderCommentsExternal(docId);
      
      commentsOuterWrapper.style.display = "block";
      commentsOuterWrapper.scrollIntoView({ behavior: "smooth", block: "start" });
      
      // Show success feedback
      const toast = document.createElement('div');
      toast.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2d7d46;color:#fff;padding:12px 24px;border-radius:30px;font-weight:500;z-index:9999;animation:slideDown 0.3s ease;box-shadow:0 4px 15px rgba(0,0,0,0.2);';
      toast.innerHTML = '✅ Comment posted successfully!';
      document.body.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
      
    } catch(err){ console.error(err); alert("Failed to post comment."); }
  }
});

// Enter key to submit comment
commentInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    commentBtn.click();
  }
});

// Save comment to localStorage when user types (silently)
commentInput.addEventListener('input', () => {
  const comment = commentInput.value.trim();
  if (comment) {
    localStorage.setItem(SAVED_COMMENT_KEY, comment);
  } else {
    localStorage.removeItem(SAVED_COMMENT_KEY);
  }
});

if (messageCountTrigger) {
  messageCountTrigger.addEventListener("click", (e) => {
    e.stopPropagation();
    toggleCommentSection();
  });
}
</script>

<script>
// Dynamic login/signup link setup for current page redirect
(function() {
  function setupDynamicAuthLinks() {
    const currentPage = window.location.href;
    const currentFile = window.location.pathname.split('/').pop();
    let platform = 'poetry';
    if (currentFile.startsWith('store/')) platform = 'reads';
    if (currentFile === 'parent-house.html') platform = 'foundry';
    
    const loginParams = new URLSearchParams();
    loginParams.append('platform', platform);
    loginParams.append('redirect', currentPage);
    
    document.querySelectorAll('a[href*="universal-login.html"]').forEach(link => {
      link.href = `universal-login.html?${loginParams.toString()}`;
    });
    
    document.querySelectorAll('a[href*="universal-signup.html"]').forEach(link => {
      link.href = `universal-signup.html?${loginParams.toString()}`;
    });
  }
  
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', setupDynamicAuthLinks);
  } else {
    setupDynamicAuthLinks();
  }
})();
</script>
<script src="return-url-handler.js"></script>
</body>
