function updateSEOMetaTags(poem) {
  if (!poem) return;
  
  const title = poem.title || 'Poem';
  const author = poem.author || 'Anonymous';
  const fullTitle = `${title} by ${author} | Volant Poetry`;
  
  // Update page title
  document.title = fullTitle;
  
  // Update meta description
  const description = `Read "${title}" by ${author} on Volant Poetry. A beautiful poem${poem.categories?.length ? ` exploring ${poem.categories.join(', ')}` : ''}.`;
  document.querySelector('meta[name="description"]')?.setAttribute('content', description);
  
  // Update Open Graph
  document.querySelector('meta[property="og:title"]')?.setAttribute('content', fullTitle);
  document.querySelector('meta[property="og:description"]')?.setAttribute('content', description);
  const ogUrl = `https://volantpoetry.vercel.app/poem.html?collection=${collectionName}&slug=${slug}`;
  document.querySelector('meta[property="og:url"]')?.setAttribute('content', ogUrl);
  
  // Update Twitter
  document.querySelector('meta[name="twitter:title"]')?.setAttribute('content', fullTitle);
  document.querySelector('meta[name="twitter:description"]')?.setAttribute('content', description);
  
  // Update canonical link
  document.querySelector('link[rel="canonical"]')?.setAttribute('href', ogUrl);
  
  // Update Poem Schema
  updatePoemSchema(poem);
}

function updatePoemSchema(poem) {
  const schema = {
    "@context": "https://schema.org",
    "@type": "Poem",
    "name": poem.title || 'Poem',
    "author": {
      "@type": "Person",
      "name": poem.author || 'Anonymous'
    },
    "publisher": {
      "@type": "Organization",
      "name": "Volant Poetry",
      "url": "https://volantpoetry.vercel.app"
    },
    "inLanguage": "en",
    "url": `https://volantpoetry.vercel.app/poem.html?collection=${collectionName}&slug=${slug}`,
    "datePublished": poem.createdAt || new Date().toISOString().split('T')[0],
    "description": `Read "${poem.title || 'Poem'}" by ${poem.author || 'Anonymous'} on Volant Poetry. A beautiful poem.`
  };
  
  const schemaScript = document.getElementById('poemSchema');
  if (schemaScript) {
    schemaScript.textContent = JSON.stringify(schema, null, 2);
  }
}

function generateSlugFromTitle(title) {
  if (!title) return 'untitled';
  return title.toLowerCase()
    .replace(/[^a-z0-9\s-]/g, '')
    .replace(/\s+/g, '-')
    .replace(/-+/g, '-')
    .trim();
}

function showShareModal(poemId, poemTitle, poemAuthor, collection, slug) {
  const modal = document.getElementById('shareModal');
  if (!modal) return;
  const shareUrl = `${window.location.origin}/poem.html?collection=${encodeURIComponent(collection || 'recentPoems')}&slug=${encodeURIComponent(slug || generateSlugFromTitle(poemTitle))}`;
  document.getElementById('shareLinkInput').value = shareUrl;
  document.getElementById('sharePoemTitle').textContent = poemTitle || 'Poem';
  document.getElementById('sharePoemAuthor').textContent = poemAuthor || 'Anonymous';
  modal.classList.add('show');
  modal.style.display = 'flex';
}

function closeShareModal() {
  const modal = document.getElementById('shareModal');
  if (!modal) return;
  modal.classList.remove('show');
  setTimeout(() => { modal.style.display = 'none'; }, 300);
}

async function copyShareLink() {
  const input = document.getElementById('shareLinkInput');
  if (!input) return;
  const copyBtn = document.getElementById('copyLinkBtn');
  try {
    await navigator.clipboard.writeText(input.value);
    copyBtn.textContent = '✅ Copied!';
    copyBtn.classList.add('copied');
    setTimeout(() => {
      copyBtn.textContent = '📋 Copy';
      copyBtn.classList.remove('copied');
    }, 2000);
  } catch (err) {
    input.select();
    document.execCommand('copy');
    copyBtn.textContent = '✅ Copied!';
    copyBtn.classList.add('copied');
    setTimeout(() => {
      copyBtn.textContent = '📋 Copy';
      copyBtn.classList.remove('copied');
    }, 2000);
  }
}

function shareToPlatform(platform, url, poemTitle, poemAuthor) {
  const text = `📝 "${poemTitle}" by ${poemAuthor}\n\nRead this beautiful poem on Volant Poetry:`;
  let shareUrl = '';
  switch(platform) {
    case 'twitter': shareUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}`; break;
    case 'facebook': shareUrl = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}&quote=${encodeURIComponent(text)}`; break;
    case 'whatsapp': shareUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(text + ' ' + url)}`; break;
    case 'email': shareUrl = `mailto:?subject=${encodeURIComponent(`Poem: ${poemTitle}`)}&body=${encodeURIComponent(text + '\n\n' + url)}`; break;
    default: return;
  }
  window.open(shareUrl, '_blank', 'width=600,height=500');
}

function redirectToLogin(saveComment = false) {
  const currentUrl = encodeURIComponent(window.location.href);
  const loginUrl = `universal-login.html?platform=poetry&redirect=${currentUrl}`;
  if (saveComment) {
    const comment = commentInput.value.trim();
    if (comment) localStorage.setItem(SAVED_COMMENT_KEY, comment);
  }
  window.location.href = loginUrl;
}

function showLoginAlertAndRedirect(message) {
  if (confirm(message + "\n\nClick OK to sign in. Your comment will be saved.")) {
    redirectToLogin(true);
  }
}

function checkJustSignedIn() {
  const urlParams = new URLSearchParams(window.location.search);
  const justSignedIn = urlParams.get('signedIn') === 'true' || sessionStorage.getItem('justSignedIn') === 'true';
  if (justSignedIn) {
    sessionStorage.removeItem('justSignedIn');
    if (urlParams.has('signedIn')) {
      urlParams.delete('signedIn');
      const newUrl = window.location.pathname + '?' + urlParams.toString() + window.location.hash;
      window.history.replaceState({}, '', newUrl);
    }
    return true;
  }
  return false;
}

function checkSavedComment() {
  const savedComment = localStorage.getItem(SAVED_COMMENT_KEY);
  if (savedComment) {
    commentInput.value = savedComment;
    return true;
  }
  return false;
}

function clearSavedComment() {
  localStorage.removeItem(SAVED_COMMENT_KEY);
  commentInput.value = '';
}

onAuthStateChanged(auth, user => { 
  const previousUser = currentUser;
  currentUser = user; 
  const justSignedIn = (previousUser === null && user !== null) || checkJustSignedIn();
  if(slug) loadPoem(slug, justSignedIn); 
});

// ====== HELPER FUNCTIONS ======
// ============================================================

function slugify(text){ return text.toLowerCase().replace(/\s+/g,"-"); }

function escapeHtml(str) {
  if (!str) return "";
  return str.replace(/[&<>]/g, function(m) {
    if (m === "&") return "&amp;";
    if (m === "<") return "&lt;";
    if (m === ">") return "&gt;";
    return m;
  });
}

async function renderCommentsExternal(poemDocId, preserveVisibility = false) {
  if (!poemDocId) return;
  try {
    const commentsSnapshot = await getDocs(collection(db, "recentPoems", poemDocId, "comments"));
    const commentCount = commentsSnapshot.size;
    const messageCountSpan = poemCard.querySelector(".message-count");
    if (messageCountSpan) messageCountSpan.textContent = `💬 ${commentCount}`;
    
    if (commentsSnapshot.empty) {
      externalCommentList.innerHTML = "<p style='color:#888; text-align:center; padding:20px;'>No comments yet. Be the first to share your thoughts ✨</p>";
      return;
    }
    
    const comments = commentsSnapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    comments.sort((a,b) => { const ta = a.timestamp?.toMillis?.() || 0; const tb = b.timestamp?.toMillis?.() || 0; return ta - tb; });
    
    externalCommentList.innerHTML = "";
    
    for (const c of comments) {
      let displayName = c.username || "Anonymous";
      let userLink = c.userId ? `/user-profile.html?uid=${c.userId}` : "#";
      const div = document.createElement("div");
      div.className = "comment";
      div.dataset.commentId = c.id;
      div.style.cssText = "background:#fff; padding:8px 12px; margin:6px 0; border-radius:6px;";
      div.innerHTML = `<a href="${userLink}" style="font-weight:600;color:#a67c52;text-decoration:none;margin-right:6px;">${escapeHtml(displayName)}</a>: ${escapeHtml(c.text)}
        <div class="comment-actions" style="margin-top:4px;"><small class="reply-toggle" style="color:#5a3cb3; cursor:pointer;">Reply</small></div>
        <div class="reply-section" style="margin-left:20px;margin-top:6px;"></div>`;
      externalCommentList.appendChild(div);
      
      const repliesCol = collection(db, "recentPoems", poemDocId, "comments", c.id, "replies");
      const repliesSnap = await getDocs(repliesCol);
      if (!repliesSnap.empty) {
        const replySection = div.querySelector(".reply-section");
        repliesSnap.forEach(r => {
          const reply = r.data();
          replySection.innerHTML += `<div style="background:#f7f7f7; padding:6px 10px; border-radius:6px; margin:4px 0;">
            <a href="/user-profile.html?uid=${reply.userId}" style="font-weight:600; color:#5a3cb3; text-decoration:none;">${escapeHtml(reply.username)}</a>: ${escapeHtml(reply.text)}</div>`;
        });
      }
    }
    
    document.querySelectorAll('.reply-toggle').forEach(toggle => {
      toggle.removeEventListener('click', handleReplyClick);
      toggle.addEventListener('click', handleReplyClick);
    });
    
    commentsLoadedForPoem = true;
  } catch(err) {
    console.error(err);
    externalCommentList.innerHTML = "<p style='color:red;'>Failed to load comments.</p>";
  }
}

async function handleReplyClick(e) {
  const target = e.currentTarget;
  const commentDiv = target.closest(".comment");
  if (!commentDiv) return;
  const commentId = commentDiv.dataset.commentId;
  if (!commentId || !currentPoemId) return;
  if (!currentUser) {
    showLoginAlertAndRedirect("Please sign in to reply!");
    return;
  }
  
  // Check if reply input already exists
  const existingReplyInput = commentDiv.querySelector(".reply-input-container");
  if (existingReplyInput) {
    // If it exists, remove it (toggle off)
    existingReplyInput.remove();
    return;
  }
  
  // Create inline reply input
  const replyContainer = document.createElement("div");
  replyContainer.className = "reply-input-container";
  replyContainer.style.cssText = "margin-top: 8px; display: flex; flex-direction: column; gap: 6px;";
  
  replyContainer.innerHTML = `
    <div style="display: flex; gap: 6px; align-items: center;">
      <input type="text" class="reply-text-input" placeholder="Write a reply..." style="flex: 1; padding: 6px 10px; border-radius: 8px; border: 1px solid #ccc; font-family: 'Inter', sans-serif; font-size: 0.9rem;">
      <button class="reply-submit-btn" style="background: #4b2aad; color: white; border: none; border-radius: 8px; padding: 6px 14px; cursor: pointer; font-family: 'Inter', sans-serif; font-weight: 500;">Reply</button>
      <button class="reply-cancel-btn" style="background: #ccc; color: #333; border: none; border-radius: 8px; padding: 6px 12px; cursor: pointer; font-family: 'Inter', sans-serif;">Cancel</button>
    </div>
  `;
  
  // Find the reply section
  const replySection = commentDiv.querySelector(".reply-section");
  if (replySection) {
    replySection.appendChild(replyContainer);
    const input = replyContainer.querySelector(".reply-text-input");
    if (input) {
      setTimeout(() => input.focus(), 100);
    }
  }
  
  // Handle submit
  const submitBtn = replyContainer.querySelector(".reply-submit-btn");
  const cancelBtn = replyContainer.querySelector(".reply-cancel-btn");
  const inputField = replyContainer.querySelector(".reply-text-input");
  
  submitBtn.addEventListener("click", async () => {
    const replyText = inputField.value.trim();
    if (!replyText) return;
    
    submitBtn.disabled = true;
    submitBtn.textContent = "Posting...";
    
    try {
      const userDoc = await getDoc(doc(db, "users", currentUser.uid));
      const username = userDoc.exists() ? (userDoc.data().username || currentUser.email) : "Anonymous";
      
      await addDoc(collection(db, "recentPoems", currentPoemId, "comments", commentId, "replies"), {
        userId: currentUser.uid,
        username: username,
        text: replyText.trim(),
        timestamp: new Date()
      });
      
      // Remove the reply input
      replyContainer.remove();
      
      // Refresh comments to show the new reply
      const wasVisible = commentsOuterWrapper.style.display === "block";
      await renderCommentsExternal(currentPoemId);
      if (wasVisible) commentsOuterWrapper.style.display = "block";
      else commentsOuterWrapper.style.display = "none";
      
    } catch(err) {
      console.error(err);
      alert("Failed to post reply.");
      submitBtn.disabled = false;
      submitBtn.textContent = "Reply";
    }
  });
  
  cancelBtn.addEventListener("click", () => {
    replyContainer.remove();
  });
  
  inputField.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      submitBtn.click();
    }
    if (e.key === "Escape") {
      replyContainer.remove();
    }
  });
}

async function loadPoem(slug, justSignedIn = false){
  const snapshot = await getDocs(collection(db, collectionName));
  for(const snap of snapshot.docs){
    const data = snap.data();
    const compare = data.slug || slugify(data.title);
    if(compare===slug){
      currentPoemData = data;
      currentPoemId = snap.id;
      
      // ===== UPDATE SEO =====
      updateSEOMetaTags(data);
      
      titleEl.textContent = data.title;
      contentEl.innerHTML = data.content.replace(/\n/g,"<br>");

      // Views
      const views = data.views || 0;
      viewCountEl.textContent = `${views} reads`;

      // Categories
      if (data.categories && data.categories.length > 0) {
        categoriesContainer.style.display = "block";
        categoriesContainer.innerHTML = `<em>${data.categories.map(cat => `<a href="category.html?name=${encodeURIComponent(cat)}" class="category-link">${escapeHtml(cat)}</a>`).join(", ")}</em>`;
      } else {
        categoriesContainer.style.display = "none";
      }

      // Collaborators
      if (Array.isArray(data.collaborators) && data.collaborators.length > 0) {
        collaboratorLine.style.display = "block";
        const names = data.collaborators.map(c => {
          return `<a href="/user-profile.html?uid=${encodeURIComponent(c.uid)}" class="collaborator-link">${escapeHtml(c.username || 'Unknown')}</a>`;
        });
        collaboratorNames.innerHTML = names.join(", ");
      } else {
        collaboratorLine.style.display = "none";
      }

      const poetUid = data.authorId || "";
      let displayName = data.author || "Anonymous";
      let profileLink = "#";
      let profileImage = "/images/default-avatar.png";
      if(poetUid){
        try{
          const userDoc = await getDoc(doc(db,"users",poetUid));
          if(userDoc.exists()){
            const userData = userDoc.data();
            displayName = userData.username || displayName;
            profileLink = `/user-profile.html?uid=${encodeURIComponent(poetUid)}`;
            profileImage = userData.photoURL || userData.cachedAvatarURL || profileImage;
          }
        }catch(err){ console.warn(err); }
      }
      authorImgEl.src = profileImage;
      authorLinkEl.href = profileLink;
      authorLinkEl.textContent = displayName;

      if(collectionName==="recentPoems" && !data.isFeatured){
        interactiveSection.style.display="flex";
        poemCard.dataset.id = snap.id;
        currentPoemId = snap.id;
        
        commentsOuterWrapper.style.display = "none";
        commentsLoadedForPoem = false;
        
        const likeBtn = poemCard.querySelector(".like-btn");
        const likeCount = poemCard.querySelector(".like-count");
        likeCount.textContent = data.likes||0;
        if(currentUser && data.likedBy?.includes(currentUser.uid)) likeBtn.classList.add("liked");
        
        if (currentUser) {
          commentInput.classList.add('signed-in');
          commentInput.placeholder = 'Write a comment...';
          commentBtn.textContent = 'Post';
          commentBtn.style.background = '#4b2aad';
        } else {
          commentInput.classList.remove('signed-in');
          commentInput.placeholder = 'Sign in to comment...';
          commentBtn.textContent = 'Post';
          commentBtn.style.background = '#4b3f2f';
        }
        
        await renderCommentsExternal(snap.id);
        commentsOuterWrapper.style.display = "none";
        
        const hasSavedComment = checkSavedComment();
        
        if (justSignedIn && currentUser) {
          welcomeBanner.classList.add('show');
          let userName = 'Reader';
          try {
            const userDoc = await getDoc(doc(db, "users", currentUser.uid));
            if (userDoc.exists()) {
              userName = userDoc.data().username || currentUser.email?.split('@')[0] || 'Reader';
            } else {
              userName = currentUser.email?.split('@')[0] || 'Reader';
            }
          } catch (err) {
            userName = currentUser.email?.split('@')[0] || 'Reader';
          }
          
          if (hasSavedComment) {
            welcomeMessage.textContent = `Welcome back, ${userName}! Your comment is ready to post.`;
            setTimeout(() => {
              commentsOuterWrapper.style.display = "block";
              commentInput.focus();
              commentInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 500);
          } else {
            welcomeMessage.textContent = `Welcome back, ${userName}! You can now like, comment, and reply.`;
          }
          setTimeout(() => { welcomeBanner.classList.remove('show'); }, 5000);
          
        } else if (currentUser && isFirstLoad) {
          welcomeBanner.classList.add('show');
          let userName = 'Reader';
          try {
            const userDoc = await getDoc(doc(db, "users", currentUser.uid));
            if (userDoc.exists()) {
              userName = userDoc.data().username || currentUser.email?.split('@')[0] || 'Reader';
            } else {
              userName = currentUser.email?.split('@')[0] || 'Reader';
            }
          } catch (err) {
            userName = currentUser.email?.split('@')[0] || 'Reader';
          }
          welcomeMessage.textContent = `Welcome, ${userName}! Share your thoughts below.`;
          setTimeout(() => { welcomeBanner.classList.remove('show'); }, 3000);
          isFirstLoad = false;
        }
        
      } else {
        interactiveSection.style.display = "none";
        commentsOuterWrapper.style.display = "none";
      }
      return;
    }
  }
  titleEl.textContent="Poem not found"; contentEl.textContent=""; authorImgEl.src="/images/default-avatar.png"; authorLinkEl.href="#"; authorLinkEl.textContent="";
  interactiveSection.style.display = "none";
  commentsOuterWrapper.style.display = "none";
}

function toggleCommentSection() {
  if (!currentPoemId) return;
  if (commentsOuterWrapper.style.display === "none" || commentsOuterWrapper.style.display === "") {
    if (!commentsLoadedForPoem && currentPoemId) {
      renderCommentsExternal(currentPoemId).then(() => {
        commentsOuterWrapper.style.display = "block";
        setTimeout(() => {
          commentsOuterWrapper.scrollIntoView({ behavior: "smooth", block: "start" });
          if (currentUser) commentInput.focus();
        }, 100);
      });
    } else {
      commentsOuterWrapper.style.display = "block";
      setTimeout(() => {
        commentsOuterWrapper.scrollIntoView({ behavior: "smooth", block: "start" });
        if (currentUser) commentInput.focus();
      }, 100);
    }
  } else {
    commentsOuterWrapper.style.display = "none";
  }
}

// ============================================================
// ====== LIKE / COMMENT HANDLERS ======
// ============================================================

document.addEventListener("click", async e=>{
  const user = auth.currentUser;

  if(e.target.classList.contains("like-btn")){
    if(!user){ 
      showLoginAlertAndRedirect("Please sign in to like poems!");
      return; 
    }
    const card = e.target.closest(".poem-card");
    const docId = card.dataset.id;
    const countSpan = card.querySelector(".like-count");
    const likeBtn = e.target;
    const poemRef = doc(db,"recentPoems",docId);

    try{
        const docSnap = await getDoc(poemRef);
        if(!docSnap.exists()) return;
        const data = docSnap.data();
        const likedBy = Array.isArray(data.likedBy) ? data.likedBy : [];
        let likes = data.likes || 0;

        if(likedBy.includes(user.uid)){
            const newLikes = Math.max(likes - 1, 0);
            await updateDoc(poemRef,{
                likes: newLikes,
                likedBy: likedBy.filter(uid => uid !== user.uid)
            });
            likeBtn.classList.remove("liked");
            countSpan.textContent = newLikes;
        } else {
            const newLikes = likes + 1;
            await updateDoc(poemRef,{
                likes: newLikes,
                likedBy: arrayUnion(user.uid)
            });
            likeBtn.classList.add("liked");
            countSpan.textContent = newLikes;
        }

    }catch(err){ console.error(err); }
  }

  if(e.target.classList.contains("message-count") || e.target.id === "messageCountTrigger" || e.target.closest(".message-count")){
    toggleCommentSection();
    return;
  }

  // ===== POST COMMENT =====
  if(e.target.classList.contains("comment-btn") || e.target.id === "commentBtn"){
    if(!user){ 
      const comment = commentInput.value.trim();
      if (comment) {
        localStorage.setItem(SAVED_COMMENT_KEY, comment);
        showLoginAlertAndRedirect("Please sign in to post your comment.");
      } else {
        showLoginAlertAndRedirect("Please sign in to comment!");
      }
      return; 
    }
    
    const card = e.target.closest(".poem-card");
    const docId = card.dataset.id;
    const input = document.getElementById("commentInput");
    const text = input.value.trim();
    if(!text) return;
    
    if(!currentPoemId && docId) currentPoemId = docId;

    try{
      const userDoc = await getDoc(doc(db,"users",user.uid));
      const username = userDoc.exists() ? (userDoc.data().username || user.email) : "Anonymous";

      await addDoc(collection(db,"recentPoems",docId,"comments"),{ 
        userId: user.uid, 
        username, 
        text, 
        timestamp: new Date() 
      });

      clearSavedComment();
      
      const wasVisible = (commentsOuterWrapper.style.display === "block");
      await renderCommentsExternal(docId);
      
      commentsOuterWrapper.style.display = "block";
      commentsOuterWrapper.scrollIntoView({ behavior: "smooth", block: "start" });
      
      const toast = document.createElement('div');
      toast.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2d7d46;color:#fff;padding:12px 24px;border-radius:30px;font-weight:500;z-index:9999;animation:slideDown 0.3s ease;box-shadow:0 4px 15px rgba(0,0,0,0.2);';
      toast.innerHTML = '✅ Comment posted successfully!';
      document.body.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
      
    } catch(err){ console.error(err); alert("Failed to post comment."); }
  }
});

commentInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    commentBtn.click();
  }
});

commentInput.addEventListener('input', () => {
  const comment = commentInput.value.trim();
  if (comment) localStorage.setItem(SAVED_COMMENT_KEY, comment);
  else localStorage.removeItem(SAVED_COMMENT_KEY);
});

if (messageCountTrigger) {
  messageCountTrigger.addEventListener("click", (e) => {
    e.stopPropagation();
    toggleCommentSection();
  });
}
</script>

<script>
(function() {
  function setupDynamicAuthLinks() {
    const currentPage = window.location.href;
    const currentFile = window.location.pathname.split('/').pop();
    let platform = 'poetry';
    if (currentFile.startsWith('store/')) platform = 'reads';
    if (currentFile === 'parent-house.html') platform = 'foundry';
    
    const loginParams = new URLSearchParams();
    loginParams.append('platform', platform);
    loginParams.append('redirect', currentPage);
    
    document.querySelectorAll('a[href*="universal-login.html"]').forEach(link => {
      link.href = `universal-login.html?${loginParams.toString()}`;
    });
    
    document.querySelectorAll('a[href*="universal-signup.html"]').forEach(link => {
      link.href = `universal-signup.html?${loginParams.toString()}`;
    });
  }
  
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', setupDynamicAuthLinks);
  } else {
    setupDynamicAuthLinks();
  }
})();
</script>
<script src="return-url-handler.js"></script>
</body>
</html>
