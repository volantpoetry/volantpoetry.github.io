<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Poetry in Motion | Volant Poetry</title>
<script>
    // Simple console blocker - production only
    (function() {
        if (window.location.hostname.includes('localhost') || 
            window.location.hostname.includes('127.0.0.1')) {
            return; // Allow in development
        }
        
        // Block all console methods
        var methods = ['log', 'info', 'warn', 'error', 'debug', 'trace', 'table', 'group', 'groupEnd', 'dir'];
        methods.forEach(function(m) {
            console[m] = function() {};
            try {
                Object.defineProperty(console, m, { configurable: false, writable: false });
            } catch(e) {}
        });
        
        window.onerror = function() { return true; };
        window.onunhandledrejection = function() { return true; };
    })();
</script>
<link rel="stylesheet" href="tes.css">
<!-- Favicons -->
<link rel="icon" type="image/png" href="images/volant-favicon.png">
<link rel="apple-touch-icon" href="images/volant-favicon.png">
<script src="theme.js"></script>
<style>
  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #fdf6f0, #e2e9f0, #f7f0e5, #e8e0d8);
    background-size: 400% 400%;
    animation: gradientShift 15s ease infinite;
    color: #4b3f2f;
  }
  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .poem-section {
    width: 100%;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
    background-color: transparent;
  }
  .poem-card {
    background: linear-gradient(160deg, #fdf6f0, #e2e9f0);
    color: #4b3f2f;
    border-radius: 14px;
    max-width: 700px;
    width: 100%;
    padding: 30px 25px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    display: flex;
    flex-direction: column;
    gap: 15px;
  }
  #poem-title { font-family: 'Playfair Display', serif; font-size: 1.8rem; margin:0; }
  #poem-content { font-family: 'Inter', sans-serif; font-size: 1rem; line-height: 1.6; white-space: pre-wrap; }
  .author { font-style: italic; font-size: 0.9rem; color: #6b5a4c; }
  @media (max-width: 768px) {
  .poem-card { padding: 20px 15px; width: 84%; margin-left: -8%; }
  #poem-title { font-size: 1.5rem; }
  }

  /* ===== NIGHT READING TOGGLE (floating) ===== */
  .night-toggle {
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    gap: 6px !important;
    background: none !important;
    border: none !important;
    font-size: 1.3rem !important;
    cursor: pointer !important;
    padding: 6px 8px !important;
    border-radius: 10px !important;
    color: #4b2aad !important;
    line-height: 1 !important;
    transition: transform 0.2s ease, background 0.2s ease !important;
    font-family: 'Inter', sans-serif !important;
    position: fixed !important;
    top: 16px !important;
    right: 16px !important;
    z-index: 1100 !important;
  }
  .night-toggle:hover { transform: scale(1.12) !important; background: rgba(75, 42, 173, 0.08) !important; }
  .theme-label { font-size: 0.85rem !important; font-weight: 600 !important; }
  @media (max-width: 768px) { .theme-label { display: none !important; } }

  /* ===== ESPRESSO NIGHT ===== */
  html[data-theme="dark"] body {
    background: linear-gradient(135deg, #161210 0%, #1d1813 30%, #201a14 60%, #161210 100%) !important;
    background-size: 400% 400% !important;
    color: #ece2d0 !important;
  }
  html[data-theme="dark"] .poem-card {
    background: linear-gradient(160deg, #211b16, #1d1813) !important;
    color: #ece2d0 !important;
    border: 1px solid #332b22;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.55) !important;
  }
  html[data-theme="dark"] #poem-title { color: #a78bfa !important; }
  html[data-theme="dark"] #poem-content { color: #ece2d0 !important; }
  html[data-theme="dark"] .author { color: #a2947e !important; }
  html[data-theme="dark"] .night-toggle { color: #a78bfa !important; }
  html[data-theme="dark"] .night-toggle:hover { background: #2a241e !important; color: #c9b6ff !important; }
  </style>
</head>
  <body>
  
  <button class="night-toggle" data-theme-btn onclick="toggleTheme()" type="button" aria-pressed="false" title="Switch to night reading">
    <span class="theme-icon" aria-hidden="true">🌙</span>
    <span class="theme-label">Night reading</span>
  </button>
  
  <section class="poem-section">
  <div id="poem-container" class="poem-card">
    <h2 id="poem-title"></h2>
    <p id="poem-content"></p>
    <span class="author" id="poem-author"></span>
  </div>
</section>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC4DHI8aBVY4JjTvJ-r-TGIDPsewtEWxzU",
  authDomain: "silent-depth.firebaseapp.com",
  projectId: "silent-depth",
  storageBucket: "silent-depth.appspot.com",
  messagingSenderId: "78008755450",
  appId: "1:78008755450:web:3fd0f0f298a08820935543"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const params = new URLSearchParams(window.location.search);
const collectionName = params.get("collection");
const slug = params.get("slug");

const titleEl = document.getElementById("poem-title");
const contentEl = document.getElementById("poem-content");
const authorEl = document.getElementById("poem-author");

async function loadMotionPoem() {
  if (!collectionName || !slug) {
    titleEl.textContent = "Poem not found";
    return;
  }

  try {
    const colRef = collection(db, collectionName);
    const snapshot = await getDocs(colRef);

    if (snapshot.empty) {
      titleEl.textContent = "Poem not found";
      return;
    }

    // Find the document matching the slug
    const docSnap = snapshot.docs.find(d => {
      const data = d.data();
      const docSlug = data.slug || (data.title ? data.title.toLowerCase().replace(/\s+/g, "-") : d.id);
      return docSlug === slug;
    });

    if (!docSnap) {
      titleEl.textContent = "Poem not found";
      return;
    }

    const data = docSnap.data();
    titleEl.textContent = data.title || "Untitled";
    contentEl.innerHTML = data.content ? data.content.replace(/\n/g, "<br>") : "";
    authorEl.textContent = data.authorName || data.author || data.username || "Anonymous";

  } catch (err) {
    console.error("Error loading poem:", err);
    titleEl.textContent = "Poem not found";
  }
}

document.addEventListener("DOMContentLoaded", loadMotionPoem);
</script>

<script src="return-url-handler.js"></script>
</body>
</html>
